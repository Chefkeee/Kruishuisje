<title>Huishouden</title>
<style>
:root{
  --bg:#E7EEEA;--surface:#FFFFFF;--sunk:#D5E1DB;--ink:#12343B;--muted:#5B7175;--line:#D3DED9;
  --accent:#1F6F68;--accent-ink:#FFFFFF;--attn:#C38A0A;--attn-fill:#E9B53B;--late:#B23A48;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1E22;--surface:#18292E;--sunk:#22383D;--ink:#E4EEEA;--muted:#94A9AC;--line:#253C40;
  --accent:#5CC2B5;--accent-ink:#0F1E22;--attn:#F0C14B;--attn-fill:#B59A5A;--late:#F08391;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1E22;--surface:#18292E;--sunk:#22383D;--ink:#E4EEEA;--muted:#94A9AC;--line:#253C40;
  --accent:#5CC2B5;--accent-ink:#0F1E22;--attn:#F0C14B;--attn-fill:#B59A5A;--late:#F08391;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 20px 10px}
.wrap{max-width:640px;margin:0 auto}
h1{font:700 32px/1.1 var(--round);letter-spacing:-.015em;margin:0}
.today-line{color:var(--muted);font-size:15px;margin:2px 0 0}
.actions{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.iconbtn[hidden]{display:none}

main .wrap{padding:0 16px calc(150px + env(safe-area-inset-bottom,0px))}
section{margin-top:24px}
h2{font:600 19px/1.25 var(--round);margin:0 0 8px 4px}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.plain{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.row.plain{padding:11px 14px}
.main{flex:1;min-width:0}
.title{font-weight:500;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.late{color:var(--late);font-weight:600}
.due{color:var(--attn);font-weight:600}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.check.on{background:var(--accent)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;font-size:22px;line-height:1;flex:none}
.addrow{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font-weight:600;text-align:left;display:flex;align-items:center;gap:10px}
.group > .addrow:first-child{border-top:0}
.isdone .title{text-decoration:line-through;color:var(--muted)}
.empty{padding:20px 18px;color:var(--muted);background:var(--surface);border-radius:14px}
.empty p{margin:0 0 12px}
.empty p:last-child{margin:0}

.btn{border:0;border-radius:12px;padding:12px 16px;font:600 16px var(--ui);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:none;color:var(--late)}
.btn.wide{width:100%;display:block;text-align:center}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface);border:0;border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .wd{font-size:12px;color:var(--muted)}
.day .n{font:700 21px/1.15 var(--round)}
.day.is-today{background:var(--accent);color:var(--accent-ink)}
.day.is-today .wd{color:inherit;opacity:.8}
.dots{display:flex;gap:2px;height:5px;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dot.ev{background:var(--attn-fill)}
.is-today .dot{background:var(--accent-ink)}
.is-today .dot.ev{background:var(--attn-fill)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* money */
.purse{padding:16px}
.purse .label{color:var(--muted);font-size:15px}
.purse .big{font:700 36px/1.1 var(--round);font-variant-numeric:tabular-nums;margin:2px 0 12px;letter-spacing:-.01em}
.purse .big.neg{color:var(--late)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .f{background:var(--accent)}
.bar .s{background:var(--attn-fill)}
.ledger{margin:12px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.ledger dt{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ledger dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthnav b{font:600 17px var(--round);text-transform:none}
.monthnav button{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 4px 0}
.cat{font-size:13px;background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--muted)}
.cat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* groceries */
.quick{display:flex;gap:8px}
.quick input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:15px}

/* agenda */
.datebox{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--sunk);padding:4px 0 5px}
.datebox b{display:block;font:700 19px/1.1 var(--round)}
.datebox span{font-size:12px;color:var(--muted)}
.datebox.dl{background:color-mix(in srgb,var(--attn-fill) 30%,var(--surface))}
details summary{cursor:pointer;color:var(--muted);margin:0 0 8px 4px;font-weight:500}

.hint{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.hint p{margin:0;flex:1;font-size:15px}

input,select,textarea{width:100%;font:16px var(--ui);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date],input[type=time]{min-height:48px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex}
.tab{flex:1;min-width:0;border:0;background:none;color:var(--muted);padding:8px 0 6px;font:500 10.5px var(--ui);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;border-radius:18px 18px 0 0;background:var(--bg);color:var(--ink);max-height:92dvh;overflow-y:auto;overscroll-behavior:contain}
dialog::backdrop{background:rgba(8,20,22,.45)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet{padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 14px}
.sheet-head h3{font:600 17px var(--round);margin:0;text-align:center;flex:1}
.link{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 0;min-width:84px;text-align:left}
.link.strong{font-weight:600;text-align:right}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{grid-column:1/-1}
.field.half{grid-column:auto}
.field label{display:block;font-size:14px;color:var(--muted);margin:0 0 5px 2px}
.err{color:var(--late);margin:12px 2px 0}
.sheet .btn.danger{margin-top:18px}
.sheet .stack{display:grid;gap:10px;margin-top:14px}
.sheet p{margin:0 0 6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:var(--attn-fill);font-weight:600;padding:4px 0;white-space:nowrap}

.who{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px var(--round);flex:none}
.who-p1,.who-p1-bg{background:var(--accent);color:var(--accent-ink)}
.who-p2,.who-p2-bg{background:var(--attn-fill);color:#1D1A10}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;margin-top:12px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.statrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.statname{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statbar{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.statbar i{display:block;height:100%;border-radius:4px}
.aisle{padding:12px 14px 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.aisle:first-child{border-top:0}
.aisle + .row{border-top:0}
.qty{color:var(--accent);font-weight:700}
.aisle-in{flex:1;padding:8px 10px}
.x:disabled{opacity:.3}
.datebox[style]{background:color-mix(in srgb,var(--k) 24%,var(--surface))}
.kind{display:inline-flex;align-items:center;gap:6px}
.kind::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k);flex:none}
.pair{display:inline-flex;flex:none}
.pair .who + .who{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.h2sub{font:500 15px var(--ui);color:var(--muted);margin-left:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-wd{font-size:12px;color:var(--muted);padding:2px 0 4px}
.cal-day{border:0;background:none;border-radius:10px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font:500 15px var(--ui);color:var(--ink);min-height:46px}
.cal-day.is-today > span:first-child{color:var(--accent);font-weight:800}
.cal-day.is-sel{background:var(--accent);color:var(--accent-ink)}
.cal-day.is-sel > span:first-child{color:inherit}
.cal-dots{display:flex;gap:2px;height:6px}
.cal-dots i{width:6px;height:6px;border-radius:50%}
.cal-day.is-sel .cal-dots i{box-shadow:0 0 0 1.5px var(--accent-ink)}
.filt{flex-wrap:nowrap;overflow-x:auto;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.field[hidden]{display:none}
/* klussen */
.house{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#1F6F68 0%,#2A5A7A 100%);position:relative;overflow:hidden}
.house::after{content:"🏡";position:absolute;right:-6px;bottom:-14px;font-size:92px;opacity:.16;transform:rotate(-8deg)}
.house h3{margin:0 0 12px;font:700 20px var(--round)}
.house-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.house-stats div{background:rgba(255,255,255,.14);border-radius:12px;padding:10px 12px}
.house-stats b{display:block;font:700 24px/1.1 var(--round)}
.house-stats span{font-size:13px;opacity:.85}
.house-money{margin-top:12px;font-size:15px;opacity:.95}
.house-money b{font-variant-numeric:tabular-nums}
.house-next{margin-top:6px;font-size:14px;opacity:.85}
.jobs{display:grid;gap:10px}
.job{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:0;background:var(--surface);border-radius:16px;padding:14px 14px 14px 16px;position:relative;overflow:hidden}
.job::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--p)}
.job-icon{width:46px;height:46px;border-radius:13px;background:var(--sunk);display:grid;place-items:center;font-size:23px;flex:none}
.job-icon.big{width:58px;height:58px;font-size:30px;border-radius:16px}
.job-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.job-top{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.tag{font-size:11.5px;letter-spacing:.01em;text-transform:none;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--t,#9A9EA8) 18%,var(--surface));color:var(--t,var(--muted));font-weight:700}
.job-title{font:600 17px/1.3 var(--round);overflow-wrap:anywhere}
.job-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;font-size:14px;color:var(--muted)}
.job-meta > span{display:inline-flex;align-items:center;gap:6px}
.mat{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:4px}
.matbar{flex:1;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;max-width:170px}
.matbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.who-pro{background:#8A7064;color:#fff;font-size:13px}
.jhero{display:flex;gap:14px;align-items:center;margin:4px 0 14px}
.jhero h2{margin:4px 0 0;font:700 22px/1.2 var(--round)}
.seg4{grid-template-columns:repeat(4,1fr);margin:0 0 14px}
.sheet h4{font:600 16px var(--round);margin:18px 2px 8px;display:flex;justify-content:space-between}
.sheet h4 span{font:500 14px var(--ui);color:var(--muted)}
.inforow{display:flex;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.inforow:first-child{border-top:0}
.inforow dt{color:var(--muted);width:92px;flex:none;font-size:15px}
.inforow dd{margin:0;flex:1;display:flex;align-items:center;gap:8px;min-width:0;overflow-wrap:anywhere}
.inforow a{color:var(--accent);font-weight:600}
.notebox{background:var(--surface);border-radius:14px;padding:12px 14px;margin:0;white-space:pre-wrap}
.quick.inrow{padding:10px 12px;border-top:1px solid var(--line)}
.quick.inrow input{padding:10px}
.quick.inrow .btn{padding:10px 16px}
/* weekoverzicht */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border-radius:14px;padding:10px 12px}
.tile b{display:block;font:700 22px/1.1 var(--round)}
.tile span{font-size:13px;color:var(--muted)}
.wk-day{padding:10px 14px;border-top:1px solid var(--line)}
.wk-day:first-child{border-top:0}
.wk-day h5{margin:0 0 4px;font:600 15px var(--round);display:flex;gap:8px;align-items:baseline}
.wk-day h5 small{font:500 13px var(--ui);color:var(--accent)}
.wk-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:15px}
.wk-dot{width:8px;height:8px;border-radius:50%;flex:none}
.wk-time{color:var(--muted);font-variant-numeric:tabular-nums;min-width:40px;font-size:14px}
.wk-title{flex:1;min-width:0;overflow-wrap:anywhere}
.wk-title small{color:var(--muted)}
.wk-row .who{width:22px;height:22px;font-size:11px}
.legend .linkbtn{margin-left:auto;padding:0;font-size:13px;font-weight:600}
/* snelle plusknop */
.fab{position:fixed;right:16px;bottom:calc(70px + env(safe-area-inset-bottom,0px));z-index:7;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 24px rgba(0,0,0,.25);display:grid;place-items:center}
.fab[hidden]{display:none}
@media (min-width:672px){.fab{right:calc(50% - 320px + 16px)}}
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.qa{border:0;background:var(--surface);border-radius:16px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font:600 14px var(--ui);color:var(--ink)}
.qa i{font-style:normal;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:23px;background:color-mix(in srgb,var(--c) 20%,var(--surface))}
/* winkelmodus */
.shop{position:fixed;inset:0;z-index:15;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
.shop[hidden]{display:none}
.shop-in{max-width:640px;margin:0 auto}
.shop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.shop-head h2{font:700 30px/1.1 var(--round);margin:0}
.shop-head p{margin:2px 0 0;color:var(--muted)}
.shop-aisle{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:20px 4px 8px}
.shop-item{width:100%;display:flex;align-items:center;gap:16px;border:0;background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:8px;min-height:68px;font:500 21px/1.25 var(--ui);color:var(--ink);text-align:left;transition:opacity .25s ease, transform .25s ease}
.shop-check{width:34px;height:34px;border-radius:50%;border:3px solid var(--accent);flex:none;display:grid;place-items:center;color:var(--accent-ink)}
.shop-name{flex:1;min-width:0;overflow-wrap:anywhere}
.shop-item.ticking{opacity:.35;transform:translateX(14px)}
.shop-item.ticking .shop-check,.shop-item.isdone .shop-check{background:var(--accent)}
.shop-item.isdone{opacity:.55;min-height:56px;font-size:18px}
.shop-item.isdone .shop-name{text-decoration:line-through}
.shop-empty{text-align:center;padding:48px 10px 24px;font:700 24px var(--round)}
.shop-empty span{display:block;font-size:56px;margin-bottom:8px}
.shop-add{position:fixed;left:0;right:0;bottom:0;z-index:16;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line)}
.shop-add .quick{max-width:640px;margin:0 auto}
/* wat is er veranderd */
.news{padding:14px 16px}
.news-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.news-head b{font:600 17px var(--round)}
.news-head .linkbtn{padding:4px 0}
.news-row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;font-size:15px}
.news-row .who{width:24px;height:24px;font-size:11px;margin-top:1px}
.news-row span.txt{flex:1;min-width:0}
.news-row time{color:var(--muted);font-size:13px;white-space:nowrap;margin-top:2px}
.tab{position:relative}
.tdot{position:absolute;top:5px;left:calc(50% + 7px);width:9px;height:9px;border-radius:50%;background:var(--late);border:2px solid var(--surface)}
.home > :first-child{margin-top:12px}
.switch{width:48px;height:28px;border-radius:14px;background:var(--sunk);position:relative;border:0;flex:none;padding:0;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.switch[aria-pressed="true"]{background:var(--accent)}
.switch[aria-pressed="true"]::after{transform:translateX(20px)}
.row.off .title{color:var(--muted)}
#q{font-size:17px;padding:13px 14px;border-radius:12px}
.sres-head{font:600 15px var(--round);margin:18px 4px 8px;display:flex;gap:8px;align-items:center}
.sres-head span{color:var(--muted);font:500 13px var(--ui)}
.sres .ic{width:34px;height:34px;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:17px;flex:none}
mark{background:color-mix(in srgb,var(--attn-fill) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.logo-btn{border:0;padding:0;background:none;width:38px;height:38px;border-radius:11px;overflow:hidden;flex:none;box-shadow:0 2px 8px -3px rgba(62,56,54,.45),inset 0 0 0 1px rgba(255,255,255,.25)}
.logo-btn img{display:block;width:100%;height:100%}
.actions{align-items:center}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.iconbtn{position:relative}
.syncdot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);display:none}
.syncdot.busy{display:block;background:var(--attn-fill)}
.syncdot.offline,.syncdot.error{display:block;background:var(--late)}
.gate .group{padding:16px}
.gate .group > p{margin:0 0 12px}
.gate .fields{margin-bottom:14px}
.gate textarea{font:12px/1.4 ui-monospace,Menlo,monospace}
.msg{margin:12px 0 0;font-size:15px}
.msg.bad{color:var(--late)}
.msg.good{color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:10px 0;font-size:15px;text-align:left}
.status{display:flex;align-items:center;gap:8px;margin:0 0 8px}

/* ===== Restyling v10: Delfts huis ===== */
:root{
  --bg:#EDF1F6;--surface:#FFFFFF;--sunk:#E2E8F1;--ink:#15213B;--muted:#5E6A80;--line:#DDE3EC;
  --accent:#2C4A9A;--accent-ink:#FFFFFF;--attn:#9A6200;--attn-fill:#F2B33D;--late:#C8364F;
  --tile:#4A66B5;
  --round:ui-serif,"New York","Iowan Old Style","Palatino",Georgia,serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322;--surface:#172036;--sunk:#222C45;--ink:#E7ECF6;--muted:#9AA6BE;--line:#27324C;
  --accent:#93AEF5;--accent-ink:#0D1322;--attn:#F5C561;--attn-fill:#E9B03B;--late:#F2899A;--tile:#B6C8F8}}
:root[data-theme="dark"]{
  --bg:#0D1322;--surface:#172036;--sunk:#222C45;--ink:#E7ECF6;--muted:#9AA6BE;--line:#27324C;
  --accent:#93AEF5;--accent-ink:#0D1322;--attn:#F5C561;--attn-fill:#E9B03B;--late:#F2899A;--tile:#B6C8F8}

/* kop en tabbalk: doorschijnend zoals iOS */
.top,body::before{background:color-mix(in srgb,var(--bg) 84%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px)}
.top .wrap{padding:18px 20px 12px}
h1{font:700 34px/1.05 var(--round);letter-spacing:-.02em}
.today-line{font-size:15px;margin-top:4px}
.iconbtn{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tabs{background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(1.6) blur(20px);backdrop-filter:saturate(1.6) blur(20px)}
.tab{padding:6px 0 5px;gap:2px}
.tab svg{padding:3px 12px;border-radius:12px;box-sizing:content-box;transition:background .2s}
.tab[aria-current="page"]{color:var(--accent);font-weight:700}
.tab[aria-current="page"] svg{background:color-mix(in srgb,var(--accent) 14%,transparent)}
.tdot{left:calc(50% + 10px);top:3px}

/* ritme en koppen */
section{margin-top:30px}
h2{font:600 21px/1.2 var(--round);letter-spacing:-.01em;margin:0 0 10px 4px}
.h2sub{font:500 15px var(--ui)}
.sub{font-size:14px}

/* lijsten: witte groepen met ingesprongen scheidingslijnen */
.group{border-radius:18px}
.row{border-top:0;position:relative;padding:12px 16px;min-height:58px}
.row + .row::before,.aisle + .row::before{content:"";position:absolute;top:0;left:60px;right:0;border-top:1px solid var(--line)}
.aisle + .row::before{display:none}
.addrow{color:var(--accent)}
.check{width:28px;height:28px;border-width:2px;border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.check.on{background:var(--accent);border-color:var(--accent)}
.aisle{text-transform:none;letter-spacing:0;font:600 14px var(--ui);color:var(--muted);padding:14px 16px 2px;border-top:1px solid var(--line)}
.title{font-weight:500;font-size:16.5px}
.empty{background:transparent;border:1.5px dashed color-mix(in srgb,var(--muted) 35%,transparent);border-radius:18px;padding:22px 20px}

/* knoppen en velden */
.btn{border-radius:14px;padding:13px 18px}
.btn.ghost{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
input,select,textarea{border-radius:12px;border-color:var(--line)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.chip{background:var(--surface);border-color:var(--line);padding:8px 14px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{background:var(--sunk);border-radius:12px}
.seg button{border-radius:9px}
.seg button[aria-pressed="true"]{box-shadow:0 1px 2px rgba(21,33,59,.12),0 2px 8px -4px rgba(21,33,59,.25)}
.linkbtn{color:var(--accent);font-weight:600}

/* personen */
.who{font:700 12px var(--ui)}
.who-p2,.who-p2-bg{color:#2A1E00}

/* weekstrip: vandaag als Delfts tegeltje */
.week{gap:6px}
.day{border-radius:14px;padding:9px 0 10px;box-shadow:inset 0 0 0 1px var(--line)}
.day .n{font:600 22px/1.15 var(--round)}
.day.is-today{box-shadow:none;color:var(--accent-ink);
  background:
    radial-gradient(circle at 0 0,var(--tile) 0 8px,transparent 8.5px),
    radial-gradient(circle at 100% 0,var(--tile) 0 8px,transparent 8.5px),
    radial-gradient(circle at 0 100%,var(--tile) 0 8px,transparent 8.5px),
    radial-gradient(circle at 100% 100%,var(--tile) 0 8px,transparent 8.5px),
    var(--accent)}
.legend{margin-top:10px}

/* geld */
.purse{padding:18px}
.purse .big{font:700 40px/1.05 var(--round);letter-spacing:-.02em}
.bar{height:10px;border-radius:5px}

/* agenda */
.datebox{border-radius:12px;width:46px}
.datebox b{font:700 20px/1.1 var(--round)}
.cal-day{border-radius:12px}
.cal-day > span:first-child{font-variant-numeric:tabular-nums}
.cal-day.is-sel{background:var(--ink);color:var(--bg)}
.cal-day.is-today:not(.is-sel){box-shadow:inset 0 0 0 1.5px var(--accent)}

/* klussen: het huis als tegelwand */
.house{border-radius:24px;color:#fff;
  background:
    radial-gradient(circle at 0 0,rgba(255,255,255,.10) 0 9px,transparent 9.5px) 0 0/46px 46px,
    radial-gradient(circle at 100% 0,rgba(255,255,255,.10) 0 9px,transparent 9.5px) 0 0/46px 46px,
    radial-gradient(circle at 0 100%,rgba(255,255,255,.10) 0 9px,transparent 9.5px) 0 0/46px 46px,
    radial-gradient(circle at 100% 100%,rgba(255,255,255,.10) 0 9px,transparent 9.5px) 0 0/46px 46px,
    linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px) 0 0/46px 46px,
    linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px) 0 0/46px 46px,
    linear-gradient(160deg,#6B7C98,#4D5A72)}
.house::after{content:none}
.house h3{font:700 24px var(--round)}
.house-stats div{background:rgba(255,255,255,.13);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);border-radius:14px}
.house-stats b{font:700 28px/1.1 var(--round)}
.job{border-radius:18px;padding:15px 16px 15px 18px}
.job::before{width:4px;top:14px;bottom:14px;border-radius:0 4px 4px 0}
.job-icon{border-radius:14px}
.job-top{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
.job-title{font:600 18px/1.25 var(--round)}

/* meldingen en kaarten */
.hint{border-radius:18px;box-shadow:inset 4px 0 0 var(--attn-fill)}
.news{border-radius:18px}
.news-head b,.sheet h4,.sres-head{font-family:var(--round)}
.tile{border-radius:16px}
.tile b{font:700 26px/1.1 var(--round)}

/* onderbladen */
dialog{border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(13,19,34,.18)}
.sheet::before{content:"";display:block;width:38px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 2px}
.sheet-head h3{font:600 18px var(--round)}
.jhero h2{font:700 24px/1.2 var(--round)}
.inforow{padding:12px 16px}

/* plusknop en melding onderin */
.fab{border-radius:20px;width:60px;height:60px;background:var(--ink);color:var(--bg);box-shadow:0 10px 26px -6px rgba(13,19,34,.45)}
.toast{border-radius:14px;background:var(--ink);color:var(--bg)}
.toast button{color:var(--attn-fill)}

/* winkelmodus */
.shop-head h2{font:700 32px/1.05 var(--round)}
.shop-aisle{text-transform:none;letter-spacing:0;font:600 15px var(--ui)}
.shop-item{border-radius:18px}

/* ===== Compacter v11 ===== */
body{font-size:15px;line-height:1.4}
.top .wrap{padding:12px 18px 8px}
h1{font-size:28px}
.today-line{font-size:14px;margin-top:2px}
.iconbtn{width:36px;height:36px}
.iconbtn svg{width:19px;height:19px}
main .wrap{padding-left:14px;padding-right:14px}
section{margin-top:22px}
.home > :first-child,section[style*="margin-top:12px"]{margin-top:8px}
h2{font-size:18px;margin:0 0 7px 4px}
.h2sub{font-size:13px;margin-left:6px}
.h2row{display:flex;align-items:baseline;justify-content:space-between;margin-right:4px}
.h2row .linkbtn{padding:0;font-size:14px}
.sub{font-size:13px}
.title{font-size:15px}
.row{padding:8px 14px;min-height:48px;gap:10px}
.row + .row::before{left:48px}
.row + .row:has(> .main:first-child)::before{left:14px}
.row + .row:has(> .datebox:first-child)::before{left:64px}
.check{width:24px;height:24px}
.check svg{width:13px;height:13px}
.x{width:28px;height:28px;font-size:20px}
.who{width:22px;height:22px;font-size:11px}
.group{border-radius:16px}
.empty{padding:16px;border-radius:16px}
.empty p{margin-bottom:10px}
.hint{padding:11px 14px;margin-top:10px;border-radius:16px}
.hint p{font-size:14px}
.btn{padding:10px 15px;font-size:15px;border-radius:12px}
.linkbtn{font-size:14px;padding:8px 0}
.chip{padding:6px 12px;font-size:14px}
.chips{gap:6px}
.seg{margin-top:10px}
.seg button{padding:7px;font-size:14px}
.addrow{font-size:15px}
.legend{font-size:12px;margin-top:8px}
/* weekstrip */
.week{gap:5px}
.day{padding:6px 0 7px;border-radius:12px}
.day .wd{font-size:11px}
.day .n{font-size:18px}
/* geld */
.purse{padding:14px 16px}
.purse .label{font-size:14px}
.purse .big{font-size:30px;margin:0 0 10px}
.ledger{font-size:14px;margin-top:10px}
.monthnav{margin-bottom:6px}
.monthnav b{font-size:16px}
.monthnav button{width:30px;height:30px;font-size:18px}
.cats{margin-top:6px}
.cat{font-size:12px}
/* agenda */
.datebox{width:40px;padding:3px 0 4px;border-radius:10px}
.datebox b{font-size:17px}
.datebox span{font-size:11px}
.cal-day{min-height:40px;padding:4px 0 3px;font-size:14px}
.cal-wd{font-size:11px}
.aisle{padding:10px 14px 0;font-size:13px}
/* klussen */
.house{padding:14px 16px;border-radius:20px}
.house h3{font-size:20px;margin-bottom:10px}
.house-stats div{padding:8px 10px;border-radius:12px}
.house-stats b{font-size:22px}
.house-stats span{font-size:12px}
.house-money,.house-next{font-size:13px}
.jobs{gap:8px}
.job{padding:11px 12px 11px 14px;gap:10px;border-radius:16px}
.job-icon{width:38px;height:38px;font-size:19px;border-radius:11px}
.job-top{font-size:12px}
.tag{font-size:11px;padding:1px 7px}
.job-title{font-size:16px}
.job-meta{font-size:13px;gap:2px 10px}
.mat{font-size:12px;margin-top:2px}
/* stats en nieuws */
.statrow{margin-top:6px}
.news{padding:12px 14px}
.news-head b{font-size:16px}
.news-row{font-size:14px;padding:5px 0}
.tiles{gap:6px}
.tile{padding:8px 10px;border-radius:14px}
.tile b{font-size:21px}
.tile span{font-size:12px}
/* onderbladen */
.sheet{padding:4px 14px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet-head{padding:6px 0 10px}
.sheet-head h3{font-size:17px}
.link{font-size:16px}
.fields{gap:10px}
.field label{font-size:13px;margin-bottom:4px}
input,select,textarea{padding:10px 12px}
input[type=date],input[type=time]{min-height:44px}
.jhero{margin:2px 0 10px;gap:12px}
.job-icon.big{width:48px;height:48px;font-size:25px}
.jhero h2{font-size:20px}
.inforow{padding:9px 14px}
.inforow dt{font-size:14px;width:80px}
.sheet h4{font-size:15px;margin:14px 2px 6px}
.wk-day{padding:8px 14px}
.wk-row{font-size:14px}
/* plusknop, tabbalk en melding */
.fab{width:52px;height:52px;border-radius:17px;bottom:calc(64px + env(safe-area-inset-bottom,0px))}
.fab svg{width:24px;height:24px}
.tab{padding:5px 0 4px}
.tab svg{width:22px;height:22px;padding:2px 11px}
.toast{bottom:calc(126px + env(safe-area-inset-bottom,0px));font-size:14px;padding:9px 13px}
/* winkelmodus: bewust groot gehouden, iets minder ruim */
.shop-item{min-height:58px;padding:11px 14px;font-size:19px;margin-bottom:6px}
.shop-check{width:30px;height:30px}
.shop-head h2{font-size:26px}
.shop-aisle{margin:14px 4px 6px;font-size:14px}

/* ===== v12: instellingen en tijdsbesteding ===== */
.setrow{width:100%;cursor:pointer}
.setrow .ic,.ana-ins .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px;background:var(--sunk);flex:none}
.row + .setrow::before{left:54px}
.chev{color:var(--muted);font-size:22px;line-height:1;margin-left:4px}
.danger-text{color:var(--late)}
.setrow .switch{pointer-events:none}
.syncline{display:flex;align-items:center;gap:12px;padding:12px 14px}
.syncline .main{flex:1;min-width:0}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--muted)}
.sdot.ok{background:#6E9184;box-shadow:0 0 0 4px color-mix(in srgb,#6E9184 20%,transparent)}
.sdot.busy{background:var(--attn-fill)}
.sdot.bad{background:var(--late)}
.statrow .statname{width:64px}
.statnum{text-align:right;font-size:12px;color:var(--muted);line-height:1.25;min-width:62px}
.statnum b{color:var(--ink);font-size:14px}
.statnum span{color:var(--ink);font-weight:600}
.ana-hero{background:var(--surface);border-radius:16px;padding:14px 16px}
.ana-big{font:700 32px/1.05 var(--round);letter-spacing:-.02em}
.ana-split{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:12px;gap:2px}
.ana-split i,.ana-cbar i{display:block;height:100%}
.ana-people{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ana-person{background:var(--surface);border-radius:16px;padding:12px 14px;min-width:0}
.ana-ph{display:flex;align-items:center;gap:8px}
.ana-ph b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ana-ph > span:last-child{color:var(--muted);font-size:13px}
.ana-num{font:700 22px/1.1 var(--round);margin-top:8px}
.ana-top{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-top:6px;color:var(--muted)}
.ana-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.ana-top span:last-child{white-space:nowrap}
.ana-ins .main{font-size:14px;line-height:1.4}
.ana-ins{align-items:flex-start}
.row + .ana-ins::before{left:54px}
.ana-cat{padding:8px 0}
.ana-cl{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:6px}
.ana-cl b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.ana-cbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;min-width:8px}
.seg.ana-seg{display:flex}
.ana-seg button{flex:auto;white-space:nowrap;font-size:13px;padding:7px 8px}

/* ===== v15: palet ===== */
:root{
  --bg:#E9E6E7;--surface:#F8F6F6;--sunk:#DDD9DA;--ink:#4A4341;--muted:#686C77;--line:#DCD7D8;
  --accent:#5D6E8B;--accent-ink:#FFFFFF;--attn:#7E685C;--attn-fill:#AB978C;--late:#B0574C;--tile:#7F8FAB;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1F1C1C;--surface:#2B2726;--sunk:#38322F;--ink:#E9E6E7;--muted:#A9ACB5;--line:#3B3533;
  --accent:#9DADC6;--accent-ink:#1F1C1C;--attn:#CDB9AE;--attn-fill:#AB978C;--late:#E08A80;--tile:#BAC5D8}}
:root[data-theme="dark"]{
  --bg:#1F1C1C;--surface:#2B2726;--sunk:#38322F;--ink:#E9E6E7;--muted:#A9ACB5;--line:#3B3533;
  --accent:#9DADC6;--accent-ink:#1F1C1C;--attn:#CDB9AE;--attn-fill:#AB978C;--late:#E08A80;--tile:#BAC5D8}
.who-p2,.who-p2-bg{color:#2F2826}
.fab{background:#5E5653;color:#F8F6F6}
.chip.on,.cal-day.is-sel{background:#5E5653;border-color:#5E5653;color:#F8F6F6}
.toast{background:#5E5653;color:#F8F6F6}
.toast button{color:#E3D6CE}
.hint{box-shadow:inset 4px 0 0 #AB978C}
.who-pro{background:#8A7064}

/* ===== v16: knoppen bovenin onderbladen ===== */
.sheet-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.sheet-head > :first-child{justify-self:start;min-width:0}
.sheet-head > :last-child{justify-self:end;min-width:0}
.sheet-head h3{flex:none}
.sheet-head .link.strong{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:7px 16px;font:600 15px/1.2 var(--ui);text-align:center;box-shadow:0 3px 10px -4px color-mix(in srgb,var(--accent) 70%,transparent);transition:transform .12s ease,filter .12s ease}
.sheet-head .link.strong:active{transform:scale(.95);filter:brightness(.92)}
.sheet-head .link:not(.strong){font-size:15px}
</style>
</head>

function addInterval(date, every, unit){
  const d = new Date(date); every = Math.max(1, +every || 1);
  if (unit === 'y'){ unit = 'm'; every *= 12; }
  if (unit === 'm'){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + every);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  else d.setDate(d.getDate() + every * (unit === 'w' ? 7 : 1));
  return d;
}
const nextDue = t => t.next ? parse(t.next) : today();
function intervalLabel(t){
  const n = +t.every || 1, u = t.unit;
  if (u === 'once') return 'Eenmalig';
  if (n === 1) return {d:'Elke dag', w:'Elke week', m:'Elke maand', y:'Elk jaar'}[u] || 'Elke week';
  return `Elke ${n} ` + ({d:'dagen', w:'weken', m:'maanden', y:'jaar'}[u] || 'weken');
}
const activeTasks = () => S.tasks.filter(t => !t.finished);
function relDay(diff, date, pastWord='te laat'){
  if (diff < 0) return `${-diff} dag${diff === -1 ? '' : 'en'} ${pastWord}`;
  if (diff === 0) return 'Vandaag';
  if (diff === 1) return 'Morgen';
  if (diff < 7) return `Over ${diff} dagen`;
  return fmtDate(date);
}

function placeToast(){ const dlg = $('#sheet'), host = dlg.open ? dlg : document.body; if (toastEl.parentNode !== host) host.appendChild(toastEl); }
function toast(msg, undo){
  const t = toastEl;
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button type="button">Ongedaan maken</button>' : '');
  t.hidden = false; placeToast(); setTimeout(placeToast, 0);
  if (undo) t.querySelector('button').onclick = e => { e.stopPropagation(); t.hidden = true; undo(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4500);

// Ongedaan maken draait alleen terug wat de actie zelf veranderde, zodat wijzigingen van de ander die
// intussen binnenkwamen blijven staan.
function snapshot(){
  const clone = o => JSON.parse(JSON.stringify(o));
  const before = clone(itemsOf(S)); let after = null;
  const pos = {}; COLL.forEach(k => (S[k] || []).forEach((x, i) => pos[x.id] = i));
  const capture = () => { if (!after) after = clone(itemsOf(S)); };
  queueMicrotask(capture);
  return () => {
    capture();
    const ids = new Set([...Object.keys(before), ...Object.keys(after)]);
    for (const id of ids){
      const b = before[id], a = after[id];
      if (canon(b && b.data) === canon(a && a.data)) continue;          // niet door de actie veranderd
      if (b) putItem(b.kind, id, b.data, pos[id]); else removeLocal(id, a.kind);
    }
    save(); render();
  };
}
function putItem(kind, id, data, at){
  data = JSON.parse(JSON.stringify(data));
  if (kind === 'settings'){ S.settings = data; ST(); return; }
  if (kind === 'history'){ S.history[id.slice(2)] = data; return; }
  if (!COLL.includes(kind)) return;
  const i = S[kind].findIndex(x => x.id === id);
  if (i >= 0) S[kind][i] = data; else if (at != null) S[kind].splice(Math.min(at, S[kind].length), 0, data); else S[kind].push(data);
}

/* ---------- zoeken ---------- */
let lastQuery = '';
function markText(text, terms){
  const raw = String(text || ''), low = raw.toLowerCase(), ranges = [];
  for (const t of terms){ let i = low.indexOf(t); while (t && i >= 0){ ranges.push([i, i + t.length]); i = low.indexOf(t, i + t.length); } }
  if (!ranges.length) return esc(raw);
  ranges.sort((a, b) => a[0] - b[0]);
  let out = '', pos = 0;
  for (const [a, b] of ranges){ if (a < pos) continue; out += esc(raw.slice(pos, a)) + '<mark>' + esc(raw.slice(a, b)) + '</mark>'; pos = b; }
  return out + esc(raw.slice(pos));
}
function searchAll(q){
  const terms = norm(q).trim().split(' ').filter(Boolean);
  if (!terms.length || terms.join('').length < 2) return null;
  const hit = (...f) => { const hay = norm(f.filter(Boolean).join(' ')); return terms.every(t => hay.includes(t)); };
  const pn = pid => (pid && person(pid) && person(pid).name) || '';
  const t0 = today();
  return [
    ['Taken', '✅', S.tasks.filter(t => hit(t.name, pn(assignee(t)))).map(t => { const d = nextDue(t); return {r:`task:${t.id}`, title:t.name, sub:`${t.finished ? 'Afgerond' : relDay(daysBetween(t0, d), d)}, ${intervalLabel(t).toLowerCase()}`}; })],
    ['Agenda', '📅', S.events.filter(e => hit(e.title, e.where, e.with, e.note, KINDS[kindOf(e)].label)).sort((a, b) => b.date.localeCompare(a.date))
      .map(e => ({r:`event:${e.id}`, title:e.title, sub:`${fmtDate(parse(e.date))}${e.repeat ? ', ' + repeatLabel(e.repeat).toLowerCase() : ''}, ${KINDS[kindOf(e)].label.toLowerCase()}${e.where ? ', ' + e.where : ''}`}))],
    ['Klussen', '🔧', (S.jobs || []).filter(j => hit(j.title, j.pro, j.note, areaOf(j)[1], (j.mats || []).map(m => m.name).join(' ')))
      .map(j => { const mats = (j.mats || []).filter(m => hit(m.name)).map(m => m.name); return {r:`job:${j.id}`, title:j.title, sub:`${areaOf(j)[1]}, ${statusLabel(j).toLowerCase()}${mats.length && !hit(j.title) ? `, nodig: ${mats.join(', ')}` : ''}`}; })],
    ['Boodschappen', '🛒', S.groceries.filter(g => hit(g.name)).map(g => ({r:`grocery:${g.id}`, title:`${(g.qty || 1) > 1 ? g.qty + '× ' : ''}${g.name}`, sub: g.done ? 'In het mandje' : 'Nog halen'}))],
    ['Uitgaven', '💶', S.spend.filter(x => hit(x.name, x.cat, euro(num(x.amount)))).sort((a, b) => b.date.localeCompare(a.date)).map(x => ({r:`spend:${x.id}`, title:x.name, sub:`${fmtDate(parse(x.date))}, ${x.cat}, ${euro(num(x.amount))}`}))],
    ['Vaste lasten en inkomen', '🏦', S.fixed.filter(x => hit(x.name)).map(x => ({r:`fixed:${x.id}`, title:x.name, sub:`${euro(num(x.amount))} ${FREQ[x.freq] || 'per maand'}`}))
      .concat(S.income.filter(x => hit(x.name)).map(x => ({r:`income:${x.id}`, title:x.name, sub:`Inkomen, ${euro(num(x.amount))} per maand`})))]
  ].filter(g => g[2].length).map(g => [...g, terms]);
}
function drawResults(q){
  const box = $('#sres'); if (!box) return;
  const res = searchAll(q);
  if (!res){ box.innerHTML = `<p class="sub" style="margin:14px 2px">Typ minstens twee letters. Je zoekt in taken, agenda, klussen (ook in wat je nodig hebt), boodschappen en geld.</p>`; return; }
  if (!res.length){ box.innerHTML = `<div class="empty" style="margin-top:14px"><p>Niets gevonden voor “${esc(q.trim())}”.</p></div>`; return; }

function searchSheet(){
  const dlg = $('#sheet');
  dlg.onsubmit = e => e.preventDefault();
  dlg.innerHTML = `<div class="sheet" style="min-height:82dvh"><div class="sheet-head"><span style="min-width:84px"></span><h3>Zoeken</h3><button type="button" class="link strong" data-close>Klaar</button></div>
    <form role="search"><input id="q" type="search" value="${esc(lastQuery)}" placeholder="Zoek in alles" autocomplete="off" autocapitalize="off" enterkeyhint="search" aria-label="Zoeken in de hele app"></form><div id="sres"></div></div>`;
  dlg.oninput = e => { if (e.target.id === 'q'){ lastQuery = e.target.value; drawResults(lastQuery); } };
  dlg.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if ('close' in b.dataset){ dlg.close(); return; }
    const r = b.dataset.r; if (!r) return;
    const [type, id] = r.split(':');
    if (type === 'task') taskForm(find('tasks', id));
    else if (type === 'event') eventForm(find('events', id));
    else if (type === 'job') jobSheet(id);
    else if (type === 'grocery') groceryForm(find('groceries', id));
    else if (type === 'spend'){ const x = find('spend', id); ym = x.date.slice(0,7); spendForm(x); }
    else if (type === 'fixed') fixedForm(find('fixed', id));
    else if (type === 'income') incomeForm(find('income', id));
  };
  drawResults(lastQuery);
  if (!dlg.open) dlg.showModal();
  const q = $('#q'); q.focus(); q.select();
}

/* ---------- personen ---------- */
function ST(){
  if (!S.settings) S.settings = defaultSettings();
  const st = S.settings;
  if (!Array.isArray(st.people) || st.people.length !== 2) st.people = defaultSettings().people;
  if (!Array.isArray(st.aisles) || !st.aisles.length) st.aisles = defaultSettings().aisles;
  if (!st.aisles.some(a => a.id === 'overig')) st.aisles.push({id:'overig', name:'Overig'});
  return st;
}
const people = () => ST().people;
const named = () => people().every(p => (p.name || '').trim());
const person = id => people().find(p => p.id === id);
const other = id => people().find(p => p.id !== id);
function me(){
  const ps = people();
  if (typeof cfg !== 'undefined' && cfg && cfg.mode === 'sync' && sync.email) return ps.find(p => p.email && p.email.toLowerCase() === sync.email.toLowerCase()) || null;
  return ps.find(p => p.id === S.ui.me) || null;
}
function claim(pid){
  if (cfg && cfg.mode === 'sync' && sync.email){
    people().forEach(p => { if (p.email && p.email.toLowerCase() === sync.email.toLowerCase()) p.email = ''; });
    person(pid).email = sync.email; ST().v = Date.now();
  } else S.ui.me = pid;
}
function assignee(t){
  if (t.who === 'rotate') return t.turn || 'p1';
  return t.who === 'p1' || t.who === 'p2' ? t.who : '';
}
function badge(pid){
  const p = person(pid);
  return p && (p.name || '').trim() ? `<span class="who who-${pid}" title="${esc(p.name)}" aria-label="${esc(p.name)}">${esc(p.name.trim()[0].toUpperCase())}</span>` : '';
}
function namesForm(){
  const m = me() || person('p1'), o = other(m.id);
  openForm({title:'Namen', values:{mine:m.name, theirs:o.name},
    fields:[{key:'mine', label:'Jouw naam', type:'text', required:true}, {key:'theirs', label:'Naam van je partner', type:'text', required:true}],
    onSave: v => { m.name = v.mine; o.name = v.theirs; ST().v = Date.now(); claim(m.id); }});
}

/* ---------- taken ---------- */
function taskRow({t, due}){
  const diff = daysBetween(today(), due);
  const cls = diff < 0 ? 'late' : diff === 0 ? 'due' : '';
  return `<div class="row"><button class="check" data-action="done" data-id="${t.id}" aria-label="${esc(t.name)} afvinken"></button>
    <button class="main plain" data-action="editTask" data-id="${t.id}"><div class="title">${esc(t.name)}</div>
    <div class="sub"><span class="${cls}">${relDay(diff, due)}</span>${t.mins ? ', ' + fmtMins(t.mins) : ''}, ${intervalLabel(t).toLowerCase()}${whoText(t)}</div></button>${assignee(t) ? badge(assignee(t)) : ''}</div>`;
}
function fmtHours(m){ m = +m || 0; if (m < 60) return `${m} min`; const h = Math.round(m / 6) / 10; return `${String(h).replace('.', ',')} uur`; }
function fmtMins(m){ m = +m; if (!m) return ''; if (m < 60) return `${m} min`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h} u ${r} min` : `${h} uur`; }
const sumMins = list => list.reduce((a, x) => a + (+x.t.mins || 0), 0);
const h2 = (label, mins) => `<h2>${label}${mins ? `<span class="h2sub">${fmtMins(mins)}</span>` : ''}</h2>`;
function whoText(t){
  const a = assignee(t), n = a && person(a) && person(a).name;
  if (t.who === 'rotate') return ', om de beurt' + (n ? ` (nu ${esc(n)})` : '');
  return n ? ', ' + esc(n) : '';
}
function renderTasks(){
  const tasks = activeTasks().map(t => ({t, due: nextDue(t)})).sort((a,b) => a.due - b.due);
  const finished = S.tasks.filter(t => t.finished).sort((a, b) => b.finished.localeCompare(a.finished));
  if (!tasks.length && !finished.length) return `<section style="margin-top:12px"><div class="empty"><p>Voeg je terugkerende klussen toe, zoals stofzuigen of het beddengoed verschonen. Vink ze af als ze gedaan zijn; de app plant de volgende keer vanzelf in.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="add" data-what="task">Taak toevoegen</button><button class="btn ghost" data-action="sampleTasks">Voorbeeldtaken gebruiken</button></div></div></section>`;
  const top = peopleCard() || (statsCard() + filterSeg());
  const mine = me();
  const f = S.ui.taskFilter === 'mine' && mine ? 'mine' : 'all';
  const shown = f === 'mine' ? tasks.filter(x => { const a = assignee(x.t); return !a || a === mine.id; }) : tasks;
  const t0 = today(), wk = new Date(t0); wk.setDate(wk.getDate() + 7);
  const groups = [['Nu aan de beurt', x => x.due <= t0], ['Deze week', x => x.due > t0 && x.due < wk], ['Later', x => x.due >= wk]];
  return `<section style="margin-top:12px">${top}</section>` + (shown.length ? '' : '<section><div class="empty"><p>Geen taken voor jou op dit moment.</p></div></section>') + groups.map(([label, g]) => { const list = shown.filter(g); return list.length ? `<section>${h2(label, sumMins(list))}<div class="group">${list.map(taskRow).join('')}</div></section>` : ''; }).join('')
    + `<section><div class="group"><button class="row addrow" data-action="add" data-what="task">${PLUS}Taak toevoegen</button></div></section>`
    + (finished.length ? `<section><details><summary>Afgeronde eenmalige taken (${finished.length})</summary><div class="group">${finished.map(t => `<div class="row isdone"><button class="check on" data-action="reopenTask" data-id="${t.id}" aria-label="${esc(t.name)} terugzetten">${CHECK}</button><button class="main plain" data-action="editTask" data-id="${t.id}"><div class="title">${esc(t.name)}</div><div class="sub">Afgerond op ${fmtDate(parse(t.finished))}</div></button><button class="x" data-action="delTask" data-id="${t.id}" aria-label="${esc(t.name)} verwijderen">×</button></div>`).join('')}</div></details></section>` : '');
}
function peopleCard(){
  if (!named()) return `<div class="empty"><p>Verdeel de taken: vul jullie namen in, dan kies je bij elke taak wie hem doet, of dat jullie het om de beurt doen.</p><button class="btn" data-action="names">Namen invullen</button></div>`;
  if (!me()) return `<div class="empty"><p>Wie ben jij op deze telefoon?</p><div style="display:flex;gap:8px;flex-wrap:wrap">${people().map(p => `<button class="btn ghost" data-action="claim" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div></div>`;
  return '';
}
function statsCard(){
  const t0 = today(), from = iso(new Date(t0.getFullYear(), t0.getMonth(), 1)), to = iso(t0);
  const E = timeEntries(from, to), cnt = {p1:0, p2:0}, mins = {p1:0, p2:0};
  E.forEach(e => { if (e.by in cnt){ if (e.type === 'taak') cnt[e.by]++; mins[e.by] += e.m; } });
  const useMins = mins.p1 + mins.p2 > 0, max = Math.max(1, ...(useMins ? [mins.p1, mins.p2] : [cnt.p1, cnt.p2]));
  return `<div class="group purse" style="padding:12px 14px"><div class="h2row" style="margin:0"><div class="label">Gedaan in ${monthName(to.slice(0,7)).split(' ')[0]}</div><button class="linkbtn" data-action="analysis" style="padding:0">Analyse ›</button></div>
    ${people().map(p => `<div class="statrow">${badge(p.id)}<span class="statname">${esc(p.name)}</span><span class="statbar"><i class="who-${p.id}-bg" style="width:${(useMins ? mins[p.id] : cnt[p.id]) / max * 100}%"></i></span><span class="statnum"><b>${cnt[p.id]}</b> ${cnt[p.id] === 1 ? 'taak' : 'taken'}<br><span>${fmtHours(mins[p.id])}</span></span></div>`).join('')}</div>`;
}
function filterSeg(){
  const f = S.ui.taskFilter === 'mine' ? 'mine' : 'all';
  return `<div class="seg"><button data-action="taskFilter" data-f="all" aria-pressed="${f === 'all'}">Alle taken</button><button data-action="taskFilter" data-f="mine" aria-pressed="${f === 'mine'}">Voor mij</button></div>`;
}

/* ---------- geld ---------- */
function monthCalc(m){
  const inc = S.income.reduce((a,x) => a + num(x.amount), 0);
  const fix = S.fixed.reduce((a,x) => a + num(x.amount) / (+x.freq || 1), 0);
  const sp = S.spend.filter(x => String(x.date).startsWith(m));
  const spent = sp.reduce((a,x) => a + num(x.amount), 0);
  return {inc, fix, spent, left: inc - fix - spent, sp};
}
function moneyBar(c){
  const total = Math.max(c.inc, c.fix + c.spent) || 1;
  return `<div class="bar" role="img" aria-label="Vaste lasten ${euro(c.fix)}, uitgaven ${euro(c.spent)}, inkomsten ${euro(c.inc)}"><i class="f" style="width:${c.fix/total*100}%"></i><i class="s" style="width:${c.spent/total*100}%"></i></div>
  <dl class="ledger"><dt><span class="sw" style="background:var(--sunk);outline:1px solid var(--line)"></span>Inkomsten</dt><dd>${euro(c.inc)}</dd>
  <dt><span class="sw" style="background:var(--accent)"></span>Vaste lasten per maand</dt><dd>${euro(c.fix)}</dd>
  <dt><span class="sw" style="background:var(--attn-fill)"></span>Uitgaven</dt><dd>${euro(c.spent)}</dd></dl>`;
}

let KWLIST = null;

const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };

function nthDate(base, rep, n){
  const k = +rep.slice(1) || 1, u = rep[0];
  return u === 'y' ? addInterval(base, 12 * k * n || 0, 'm') : n ? addInterval(base, k * n, u) : new Date(base);
}
function eventDates(e, from, to){
  const base = parse(e.date);
  if (!e.repeat) return base >= from && base <= to ? [e.date] : [];
  const until = e.until ? parse(e.until) : null, skip = e.skip || [], out = [];

}
function taskDates(t, from, to){
  const t0 = today(), out = []; let base = nextDue(t), n0 = 0;
  if (t.finished) return out;
  if (t.unit === 'once'){ const d = base < t0 ? t0 : base; if (d >= from && d <= to) out.push({date: iso(d), first: true, late: base < t0}); return out; }
  if (base < t0){ if (t0 >= from && t0 <= to) out.push({date: iso(t0), first: true, late: true}); base = addInterval(t0, t.every, t.unit); n0 = -1; }
  for (let n = 0; n < 1000; n++){
    const d = n ? addInterval(base, (+t.every || 1) * n, t.unit) : base;
    if (d > to) break;
    if (d >= from) out.push({date: iso(d), first: n === 0 && n0 === 0, late: false});

}
const evDone = (e, date) => e.repeat ? (e.doneDates || []).includes(date) : !!e.done;
function agendaItems(from, to, withTasks = true){
  const items = [];
  for (const e of S.events) for (const date of eventDates(e, from, to)) items.push({type:'ev', e, date, kind: kindOf(e), time: e.time || '', done: evDone(e, date)});
  if (withTasks) for (const t of S.tasks) for (const o of taskDates(t, from, to)) items.push({type:'task', t, kind:'taak', time:'', done:false, ...o});
  for (const j of S.jobs || []) if (j.date && j.status !== 'klaar'){ const d = parse(j.date); if (d >= from && d <= to) items.push({type:'job', j, date: j.date, kind:'klus', time:'', done:false}); }

  const up = agendaItems(t0, addDays(t0, 90)).filter(evMatch).filter(it => { const days = daysBetween(t0, parse(it.date)); return !it.done && (it.type === 'ev' ? !it.e.repeat || days < 31 : it.type === 'task' ? days < taskDays : true); });
  const past = S.events.filter(e => !e.repeat && (e.done || e.date < t)).map(e => ({type:'ev', e, date: e.date, kind: kindOf(e), done: !!e.done}))
    .filter(evMatch).filter(it => !late.some(l => l.e === it.e)).sort((a, b) => b.date.localeCompare(a.date));
  return html
    + (late.length ? `<section><h2 class="late">Over de deadline</h2><div class="group">${late.map(itemRow).join('')}</div></section>` : '')
    + `<section><h2>Komend</h2><div class="group">${dayList(up)}<button class="row addrow" data-action="add" data-what="event">${PLUS}Iets toevoegen</button></div>${agFilter === 'all' && S.tasks.length ? `<p class="sub" style="margin:8px 4px 0">Taken zie je hier voor de komende week en herhalende afspraken voor de komende maand. In de kalender zie je alles.</p>` : ''}</section>`
    + (past.length ? `<section><details><summary>Geweest en afgerond (${past.length})</summary><div class="group">${past.map(itemRow).join('')}</div></details></section>` : '');
}

function openForm({title, fields, values = {}, onSave, onDelete, extra, note, after, deleteLabel = 'Verwijderen'}){
  const dlg = $('#sheet');
  const inputs = fields.map(fl => {
    let v = values[fl.key] ?? fl.def ?? ''; const id = 'f_' + fl.key; let input;
    if (fl.type === 'select') input = `<select id="${id}" name="${fl.key}">${fl.options.map(([val,lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
    else if (fl.type === 'textarea') input = `<textarea id="${id}" name="${fl.key}" rows="3">${esc(v)}</textarea>`;
    else { if (fl.type === 'money' && v !== '') v = num(v).toFixed(2).replace('.', ',');
      const type = fl.type === 'money' || fl.type === 'int' ? 'text' : fl.type;
      const mode = fl.type === 'money' ? ' inputmode="decimal"' : fl.type === 'int' ? ' inputmode="numeric"' : '';
      input = `<input id="${id}" name="${fl.key}" type="${type}"${mode} value="${esc(v)}"${fl.placeholder ? ` placeholder="${esc(fl.placeholder)}"` : ''} autocomplete="off">`; }
    return `<div class="field${fl.half ? ' half' : ''}"><label for="${id}">${esc(fl.label)}</label>${input}</div>`;
  }).join('');
  dlg.onclick = null; dlg.oninput = null; dlg.onsubmit = null;
  dlg.innerHTML = `<form class="sheet" novalidate><div class="sheet-head"><button type="button" class="link" data-close>Annuleren</button><h3>${esc(title)}</h3><button type="submit" class="link strong">Bewaren</button></div>
    ${note ? `<p class="sub" style="margin:0 2px 12px">${esc(note)}</p>` : ''}<div class="fields">${inputs}</div><p class="err" hidden></p>
    ${extra ? `<button type="button" class="btn ghost wide" data-extra style="margin-top:18px">${esc(extra.label)}</button>` : ''}${onDelete ? `<button type="button" class="btn danger wide" data-del>${esc(deleteLabel)}</button>` : ''}</form>`;
  const form = dlg.querySelector('form'), err = form.querySelector('.err');
  const cond = fields.filter(f => f.showIf);
  const refresh = () => { const vals = {}; fields.forEach(f => vals[f.key] = form.elements[f.key].value); cond.forEach(f => form.querySelector('#f_' + f.key).closest('.field').hidden = !f.showIf(vals)); };
  if (cond.length){ form.addEventListener('change', refresh); form.addEventListener('input', refresh); refresh(); }
  form.onsubmit = ev => {
    ev.preventDefault(); const out = {};
    for (const fl of fields){
      let v = form.elements[fl.key].value.trim();
      if (fl.required && !v){ err.textContent = `Vul ${fl.label.toLowerCase()} in.`; err.hidden = false; form.elements[fl.key].focus(); return; }
      if (fl.type === 'money') v = v === '' ? 0 : num(v);
      if (fl.type === 'int') v = v === '' ? '' : Math.min(fl.max ?? 9999, Math.max(fl.min ?? 1, parseInt(v) || 1));
      out[fl.key] = v;
    }
    onSave(out); dlg.close(); save(); render(); toast('Bewaard'); if (after) after();
  };
  form.querySelector('[data-close]').onclick = () => dlg.close();
  const del = form.querySelector('[data-del]');
  if (del) del.onclick = () => { const undo = snapshot(); onDelete(); dlg.close(); save(); render(); toast('Verwijderd', undo); };
  const ex = form.querySelector('[data-extra]');
  if (ex) ex.onclick = () => { const undo = snapshot(); extra.run(); dlg.close(); save(); render(); toast('Verwijderd', undo); };
  if (!dlg.open) dlg.showModal();
}

async function exportData(){
  const name = `huishouden-backup-${iso(today())}.json`;
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  try { const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Back-up huishouden'}); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;

function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data; try { data = JSON.parse(r.result); } catch(e){ toast('Dit bestand kan niet gelezen worden. Kies een back-up die met deze app is gemaakt.'); return; }
    const keys = ['tasks','income','fixed','spend','groceries','events'];
    if (!data || typeof data !== 'object' || !keys.some(k => Array.isArray(data[k]))){ toast('Dit bestand is geen back-up van deze app.'); return; }
    if (!confirm(cfg && cfg.mode === 'sync' ? 'Dit vervangt de gedeelde gegevens, voor jullie allebei, door de back-up. Doorgaan?' : 'Dit vervangt alle gegevens op deze telefoon door de back-up. Doorgaan?')) return;
    const undo = snapshot(); S = Object.assign(empty(), data); save(); $('#sheet').close(); render(); toast('Back-up teruggezet', undo);
  };
  r.readAsText(file);
}

let quietSync = false, newsShown = false, actBuf = [], actTimer;
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === 'object' && !Array.isArray(v) ? Object.keys(v).sort().reduce((r, x) => (r[x] = v[x], r), {}) : v);

function noteChange(kind, b, a){

  if (canon(b) === canon(a)) return;
  actBuf.push({kind, b, a}); clearTimeout(actTimer); actTimer = setTimeout(flushActivity, 1200);

function joinNames(list){
  const u = [...new Set(list)]; if (u.length > 4) return `${u.slice(0, 3).join(', ')} en ${u.length - 3} andere`;
  return u.length > 1 ? `${u.slice(0, -1).join(', ')} en ${u[u.length - 1]}` : (u[0] || '');
}
function flushActivity(){
  const buf = actBuf; actBuf = []; if (!buf.length) return;
  const out = [], pid = partnerId(), now = Date.now();
  const add = (by, text, icon) => out.push({t: now, by: by || pid, text, icon});
  const gAdd = buf.filter(x => x.kind === 'groceries' && !x.b && x.a);
  if (gAdd.length) add(gAdd[0].a.by, `zette ${joinNames(gAdd.map(x => x.a.name))} op de boodschappenlijst`, '🛒');
  const gDone = buf.filter(x => x.kind === 'groceries' && x.b && x.a && !x.b.done && x.a.done);
  if (gDone.length) add(pid, gDone.length > 4 ? `haalde ${gDone.length} boodschappen` : `haalde ${joinNames(gDone.map(x => x.a.name))}`, '🧺');
  for (const x of buf){
    const nm = (x.a || x.b || {}).name || (x.a || x.b || {}).title || '';

      if (!x.b) add(pid, `voegde de taak ${nm} toe`, '➕');

      else if ((x.a.log || []).length > (x.b.log || []).length){ const l = x.a.log[x.a.log.length - 1]; add(l.by || pid, `vinkte ${nm} af`, '✅'); }
      else add(pid, `paste de taak ${nm} aan`, '✏️');

      if (!x.b) add(x.a.for === 'p1' || x.a.for === 'p2' ? pid : pid, `zette ${nm} in de agenda (${fmtDate(parse(x.a.date))})`, '📅');
      else if (!x.a) add(pid, `haalde ${nm} uit de agenda`, '🗑️');
      else if (!x.b.done && x.a.done) add(pid, `rondde ${nm} af`, '✅');
      else add(pid, `paste ${nm} in de agenda aan`, '✏️');
    } else if (x.kind === 'jobs'){
      if (!x.b) add(pid, `voegde de klus ${nm} toe`, '🔧');
      else if (!x.a) add(pid, `verwijderde de klus ${nm}`, '🗑️');
      else if ((x.a.log || []).length > (x.b.log || []).length) add(pid, `rondde de klus ${nm} af`, '🎉');

/* ---------- confetti ---------- */
function confetti(x, y){
  if (S.ui.noConfetti || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'), dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30';
  c.width = W * dpr; c.height = H * dpr; c.setAttribute('aria-hidden', 'true'); document.body.append(c);
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const cs = getComputedStyle(document.documentElement);
  const cols = ['--accent', '--attn-fill', '--late'].map(v => cs.getPropertyValue(v).trim()).concat(['#AB978C', '#8C7BA0', '#7B7F8A']);
  x = x ?? W / 2; y = y ?? H / 2;
  const P = Array.from({length: 120}, () => {
    const a = -Math.PI / 2 + (Math.random() - .5) * Math.PI * 1.2, v = 7 + Math.random() * 10;
    return {x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, w: 5 + Math.random() * 5, h: 8 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .45, c: cols[Math.random() * cols.length | 0], round: Math.random() < .3};
  });
  const start = performance.now(), DUR = 1900;
  (function tick(now){
    const t = now - start; ctx.clearRect(0, 0, W, H);
    for (const p of P){
      p.vy += .34; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, t - DUR * .55) / (DUR * .45));
      ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c;
      if (p.round){ ctx.beginPath(); ctx.arc(0, 0, p.w / 2, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2, p.w, Math.abs(Math.cos(p.r * 2)) * p.h + 2);
      ctx.restore();
    }
    if (t < DUR) requestAnimationFrame(tick); else c.remove();
  })(start);
}
const centerOf = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
