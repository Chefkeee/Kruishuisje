<title>Huishouden</title>
<style>
:root{
  --bg:#E7EEEA;--surface:#FFFFFF;--sunk:#D5E1DB;--ink:#12343B;--muted:#5B7175;--line:#D3DED9;
  --accent:#1F6F68;--accent-ink:#FFFFFF;--attn:#C38A0A;--attn-fill:#E9B53B;--late:#B23A48;
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1E22;--surface:#18292E;--sunk:#22383D;--ink:#E4EEEA;--muted:#94A9AC;--line:#253C40;
  --accent:#5CC2B5;--accent-ink:#0F1E22;--attn:#F0C14B;--attn-fill:#E2B33F;--late:#F08391;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1E22;--surface:#18292E;--sunk:#22383D;--ink:#E4EEEA;--muted:#94A9AC;--line:#253C40;
  --accent:#5CC2B5;--accent-ink:#0F1E22;--attn:#F0C14B;--attn-fill:#E2B33F;--late:#F08391;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--ui);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg)}
.top .wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:16px 20px 10px}
.wrap{max-width:640px;margin:0 auto}
h1{font:700 32px/1.1 var(--round);letter-spacing:-.015em;margin:0}
.today-line{color:var(--muted);font-size:15px;margin:2px 0 0}
.actions{display:flex;gap:8px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center}
.iconbtn[hidden]{display:none}

main .wrap{padding:0 16px calc(100px + env(safe-area-inset-bottom,0px))}
section{margin-top:24px}
h2{font:600 19px/1.25 var(--round);margin:0 0 8px 4px}
.group{background:var(--surface);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;min-height:56px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.plain{background:none;border:0;padding:0;text-align:left;font:inherit;color:inherit}
.row.plain{padding:11px 14px}
.main{flex:1;min-width:0}
.title{font-weight:500;overflow-wrap:anywhere}
.sub{font-size:14px;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.late{color:var(--late);font-weight:600}
.due{color:var(--attn);font-weight:600}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--accent);background:none;flex:none;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.check.on{background:var(--accent)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;font-size:22px;line-height:1;flex:none}
.addrow{width:100%;border:0;border-top:1px solid var(--line);background:none;color:var(--accent);font-weight:600;text-align:left;display:flex;align-items:center;gap:10px}
.group > .addrow:first-child{border-top:0}
.isdone .title{text-decoration:line-through;color:var(--muted)}
.empty{padding:20px 18px;color:var(--muted);background:var(--surface);border-radius:14px}
.empty p{margin:0 0 12px}
.empty p:last-child{margin:0}

.btn{border:0;border-radius:12px;padding:12px 16px;font:600 16px var(--ui);background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:none;color:var(--late)}
.btn.wide{width:100%;display:block;text-align:center}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day{background:var(--surface);border:0;border-radius:12px;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:1px}
.day .wd{font-size:12px;color:var(--muted)}
.day .n{font:700 21px/1.15 var(--round)}
.day.is-today{background:var(--accent);color:var(--accent-ink)}
.day.is-today .wd{color:inherit;opacity:.8}
.dots{display:flex;gap:2px;height:5px;margin-top:3px}
.dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.dot.ev{background:var(--attn-fill)}
.is-today .dot{background:var(--accent-ink)}
.is-today .dot.ev{background:var(--attn-fill)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:8px 4px 0}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* money */
.purse{padding:16px}
.purse .label{color:var(--muted);font-size:15px}
.purse .big{font:700 36px/1.1 var(--round);font-variant-numeric:tabular-nums;margin:2px 0 12px;letter-spacing:-.01em}
.purse .big.neg{color:var(--late)}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar i{display:block;height:100%}
.bar .f{background:var(--accent)}
.bar .s{background:var(--attn-fill)}
.ledger{margin:12px 0 0;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15px}
.ledger dt{display:flex;align-items:center;gap:8px;color:var(--muted)}
.ledger dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.monthnav b{font:600 17px var(--round);text-transform:none}
.monthnav button{border:0;background:var(--sunk);width:34px;height:34px;border-radius:50%;font-size:20px;line-height:1}
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:8px 4px 0}
.cat{font-size:13px;background:var(--surface);border-radius:999px;padding:4px 10px;color:var(--muted)}
.cat b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* groceries */
.quick{display:flex;gap:8px}
.quick input{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:15px}

/* agenda */
.datebox{width:44px;flex:none;text-align:center;border-radius:10px;background:var(--sunk);padding:4px 0 5px}
.datebox b{display:block;font:700 19px/1.1 var(--round)}
.datebox span{font-size:12px;color:var(--muted)}
.datebox.dl{background:color-mix(in srgb,var(--attn-fill) 30%,var(--surface))}
details summary{cursor:pointer;color:var(--muted);margin:0 0 8px 4px;font-weight:500}

.hint{background:var(--surface);border-radius:14px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.hint p{margin:0;flex:1;font-size:15px}

input,select,textarea{width:100%;font:16px var(--ui);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=date],input[type=time]{min-height:48px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex}
.tab{flex:1;border:0;background:none;color:var(--muted);padding:8px 0 6px;font:500 11px var(--ui);display:flex;flex-direction:column;align-items:center;gap:3px}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:640px;border-radius:18px 18px 0 0;background:var(--bg);color:var(--ink);max-height:92dvh}
dialog::backdrop{background:rgba(8,20,22,.45)}
dialog[open]{animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet{padding:6px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0 14px}
.sheet-head h3{font:600 17px var(--round);margin:0;text-align:center;flex:1}
.link{border:0;background:none;color:var(--accent);font-size:17px;padding:6px 0;min-width:84px;text-align:left}
.link.strong{font-weight:600;text-align:right}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{grid-column:1/-1}
.field.half{grid-column:auto}
.field label{display:block;font-size:14px;color:var(--muted);margin:0 0 5px 2px}
.err{color:var(--late);margin:12px 2px 0}
.sheet .btn.danger{margin-top:18px}
.sheet .stack{display:grid;gap:10px;margin-top:14px}
.sheet p{margin:0 0 6px}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;width:max-content;max-width:calc(100% - 32px);font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.toast[hidden]{display:none}
.toast button{border:0;background:none;color:var(--attn-fill);font-weight:600;padding:4px 0;white-space:nowrap}

.who{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;font:700 12px var(--round);flex:none}
.who-p1,.who-p1-bg{background:var(--accent);color:var(--accent-ink)}
.who-p2,.who-p2-bg{background:var(--attn-fill);color:#1D1A10}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:10px;padding:3px;margin-top:12px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font-weight:600;font-size:15px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.statrow{display:flex;align-items:center;gap:10px;margin-top:8px}
.statname{width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.statbar{flex:1;height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.statbar i{display:block;height:100%;border-radius:4px}
.aisle{padding:12px 14px 2px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line)}
.aisle:first-child{border-top:0}
.aisle + .row{border-top:0}
.qty{color:var(--accent);font-weight:700}
.aisle-in{flex:1;padding:8px 10px}
.x:disabled{opacity:.3}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.iconbtn{position:relative}
.syncdot{position:absolute;top:5px;right:5px;width:10px;height:10px;border-radius:50%;border:2px solid var(--surface);display:none}
.syncdot.busy{display:block;background:var(--attn-fill)}
.syncdot.offline,.syncdot.error{display:block;background:var(--late)}
.gate .group{padding:16px}
.gate .group > p{margin:0 0 12px}
.gate .fields{margin-bottom:14px}
.gate textarea{font:12px/1.4 ui-monospace,Menlo,monospace}
.msg{margin:12px 0 0;font-size:15px}
.msg.bad{color:var(--late)}
.msg.good{color:var(--accent)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:500;padding:10px 0;font-size:15px;text-align:left}
.status{display:flex;align-items:center;gap:8px;margin:0 0 8px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div><h1 id="title">Overzicht</h1><p class="today-line" id="todayLine"></p></div>
  <div class="actions">
    <button class="iconbtn" id="addBtn" data-action="headerAdd" aria-label="Toevoegen" hidden><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="iconbtn" data-action="settings" aria-label="Back-up en instellingen"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span class="syncdot" id="syncDot"></span></button>
  </div>
</div></header>

<main><div class="wrap" id="view"></div></main>

<nav class="tabs" aria-label="Onderdelen"><div class="wrap" id="tabs"></div></nav>
<dialog id="sheet"></dialog>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
/* ---------- opslag ---------- */
const KEY = 'huishouden.v1';
const AISLES = [['groente','Groente & fruit'],['brood','Brood & bakkerij'],['vlees','Vlees, vis & vega'],['vleeswaren','Kaas & vleeswaren'],['zuivel','Zuivel & eieren'],['ontbijt','Ontbijt & beleg'],['houdbaar','Pasta, rijst & houdbaar'],['diepvries','Diepvries'],['snacks','Snacks & snoep'],['dranken','Dranken'],['drogist','Drogisterij'],['huishouden','Huishouden'],['overig','Overig']];
const defaultSettings = () => ({v:0, people:[{id:'p1', name:'', email:''},{id:'p2', name:'', email:''}], aisles: AISLES.map(([id,name]) => ({id, name}))});
const empty = () => ({tasks:[], income:[], fixed:[], spend:[], groceries:[], history:{}, events:[], ui:{}, settings: defaultSettings()});
let memory = null;
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(empty(), JSON.parse(raw)); } catch(e){}
  return memory ? JSON.parse(memory) : empty();
}
function save(){ saveLocal(); diffToPending(); }
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ memory = JSON.stringify(S); }
}
let S = load();
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch(e){}

/* ---------- hulpjes ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { let s = String(v ?? '').trim().replace(/[€\s]/g,''); if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.'); const n = parseFloat(s); return isFinite(n) ? n : 0; };
const euro = n => n.toLocaleString('nl-NL', {style:'currency', currency:'EUR'});
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = String(s).split('-').map(Number); return new Date(y, (m||1)-1, d||1); };
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const daysBetween = (a,b) => Math.round((b - a) / 86400000);
const fmtDate = d => d.toLocaleDateString('nl-NL', {weekday:'short', day:'numeric', month:'short'}).replace(/\./g,'');
const monthName = ym => parse(ym + '-01').toLocaleDateString('nl-NL', {month:'long', year:'numeric'});
const CHECK = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const PLUS = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

function addInterval(date, every, unit){
  const d = new Date(date); every = Math.max(1, +every || 1);
  if (unit === 'm'){ const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + every);
    d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth()+1, 0).getDate())); }
  else d.setDate(d.getDate() + every * (unit === 'w' ? 7 : 1));
  return d;
}
const nextDue = t => t.next ? parse(t.next) : today();
function intervalLabel(t){
  const n = +t.every || 1, u = t.unit;
  if (n === 1) return {d:'Elke dag', w:'Elke week', m:'Elke maand'}[u];
  return `Elke ${n} ` + {d:'dagen', w:'weken', m:'maanden'}[u];
}
function relDay(diff, date, pastWord='te laat'){
  if (diff < 0) return `${-diff} dag${diff === -1 ? '' : 'en'} ${pastWord}`;
  if (diff === 0) return 'Vandaag';
  if (diff === 1) return 'Morgen';
  if (diff < 7) return `Over ${diff} dagen`;
  return fmtDate(date);
}

let toastTimer;
function toast(msg, undo){
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>` + (undo ? '<button type="button">Ongedaan maken</button>' : '');
  t.hidden = false;
  if (undo) t.querySelector('button').onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 4500);
}
const snapshot = () => { const snap = JSON.stringify(S); return () => { S = JSON.parse(snap); save(); render(); }; };

/* ---------- navigatie ---------- */
const TABS = {
  home:  ['Overzicht', '<path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>'],
  taken: ['Taken', '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/>'],
  geld:  ['Geld', '<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10.5h18"/><circle cx="16.5" cy="14.8" r="1.3"/>'],
  lijst: ['Boodschappen', '<path d="M4 9h16l-1.6 10.2a1 1 0 0 1-1 .8H6.6a1 1 0 0 1-1-.8z"/><path d="M8.5 9L12 3.5 15.5 9"/>'],
  agenda:['Agenda', '<rect x="3" y="5" width="18" height="16" rx="2.5"/><path d="M3 10h18M8 3v4M16 3v4"/>']
};
let tab = TABS[S.ui.tab] ? S.ui.tab : 'home';
let ym = iso(today()).slice(0,7);

function render(){
  const gated = !!gate;
  document.querySelector('.tabs').hidden = gated;
  document.querySelector('[data-action="settings"]').hidden = gated;
  if (gated){
    $('#title').textContent = gate === 'setup' ? 'Koppelen' : 'Inloggen';
    $('#todayLine').hidden = true; $('#addBtn').hidden = true;
    $('#view').innerHTML = renderGate(); return;
  }
  setStatus(syncStatus, syncError);
  $('#title').textContent = TABS[tab][0];
  $('#todayLine').textContent = tab === 'home' ? today().toLocaleDateString('nl-NL', {weekday:'long', day:'numeric', month:'long'}) : '';
  $('#todayLine').hidden = tab !== 'home';
  $('#addBtn').hidden = !['taken','geld','agenda'].includes(tab);
  $('#addBtn').setAttribute('aria-label', {taken:'Taak toevoegen', geld:'Uitgave toevoegen', agenda:'Afspraak toevoegen'}[tab] || 'Toevoegen');
  $('#tabs').innerHTML = Object.entries(TABS).map(([k,[label,icon]]) =>
    `<button class="tab" data-action="tab" data-tab="${k}"${k === tab ? ' aria-current="page"' : ''}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${label}</button>`).join('');
  $('#view').innerHTML = ({home:renderHome, taken:renderTasks, geld:renderMoney, lijst:renderList, agenda:renderAgenda})[tab]();
}

/* ---------- overzicht ---------- */
function renderHome(){
  const t0 = today();
  const tasks = S.tasks.map(t => ({t, due: nextDue(t)})).sort((a,b) => a.due - b.due);
  let week = '';
  for (let i = 0; i < 7; i++){
    const d = new Date(t0); d.setDate(d.getDate() + i); const k = iso(d);
    const nt = tasks.filter(x => i === 0 ? x.due <= d : iso(x.due) === k).length;
    const ne = S.events.filter(e => e.date === k && !e.done).length;
    const dots = '<i class="dot"></i>'.repeat(Math.min(nt,3)) + '<i class="dot ev"></i>'.repeat(Math.min(ne,2));
    week += `<button class="day${i === 0 ? ' is-today' : ''}" data-action="tab" data-tab="${ne && !nt ? 'agenda' : 'taken'}" aria-label="${esc(d.toLocaleDateString('nl-NL',{weekday:'long', day:'numeric', month:'long'}))}: ${nt} taken, ${ne} afspraken"><span class="wd">${d.toLocaleDateString('nl-NL',{weekday:'short'}).replace('.','')}</span><span class="n">${d.getDate()}</span><span class="dots">${dots}</span></button>`;
  }
  let html = `<section style="margin-top:12px"><div class="week">${week}</div>
    <div class="legend"><span><i class="dot"></i>Taken</span><span><i class="dot ev"></i>Afspraken en deadlines</span></div></section>`;

  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!standalone && !S.ui.hideInstall) html += `<div class="hint"><p>Zet de app op je beginscherm: tik in Safari op Deel en kies Zet op beginscherm. Dan opent hij schermvullend en blijven je gegevens goed bewaard.</p><button class="x" data-action="hideInstall" aria-label="Melding sluiten">×</button></div>`;

  let dueNow = tasks.filter(x => x.due <= t0), othersDue = 0;
  const mine = named() ? me() : null;
  if (mine){ const all = dueNow.length; dueNow = dueNow.filter(x => { const a = assignee(x.t); return !a || a === mine.id; }); othersDue = all - dueNow.length; }
  html += `<section><h2>Te doen vandaag</h2>`;
  if (dueNow.length) html += `<div class="group">${dueNow.map(taskRow).join('')}</div>`;
  else if (othersDue) html += `<div class="empty"><p>Niets voor jou vandaag.</p></div>`;
  else if (tasks.length) html += `<div class="empty"><p>Alles is bij. Volgende: ${esc(tasks[0].t.name)}, ${relDay(daysBetween(t0, tasks[0].due), tasks[0].due).toLowerCase()}.</p></div>`;
  else html += `<div class="empty"><p>Nog geen taken. Zet je terugkerende klussen erin, dan zie je hier elke dag wat aan de beurt is.</p><button class="btn" data-action="tab" data-tab="taken">Naar taken</button></div>`;
  if (othersDue) html += `<p class="sub" style="margin:8px 4px 0">${othersDue === 1 ? 'Er staat ook 1 taak' : `Er staan ook ${othersDue} taken`} voor ${esc(other(mine.id).name)}.</p>`;
  html += `</section>`;

  const todayIso = iso(t0);
  const ev = S.events.filter(e => !e.done && (e.date >= todayIso || e.kind === 'deadline'))
    .sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||''))).slice(0,3);
  html += `<section><h2>Binnenkort</h2>` + (ev.length ? `<div class="group">${ev.map(eventRow).join('')}</div>`
    : `<div class="empty"><p>Geen afspraken of deadlines gepland.</p><button class="btn ghost" data-action="add" data-what="event">Afspraak toevoegen</button></div>`) + `</section>`;

  const c = monthCalc(iso(t0).slice(0,7));
  html += `<section><h2>Geld deze maand</h2>` + (c.inc || c.fix || c.spent
    ? `<button class="group plain purse" style="width:100%;display:block" data-action="tab" data-tab="geld"><div class="label">Nog te besteden in ${monthName(iso(t0).slice(0,7)).split(' ')[0]}</div><div class="big${c.left < 0 ? ' neg' : ''}">${euro(c.left)}</div>${moneyBar(c)}</button>`
    : `<div class="empty"><p>Vul je inkomsten en vaste lasten in om te zien wat je elke maand overhoudt.</p><button class="btn" data-action="tab" data-tab="geld">Naar geld</button></div>`) + `</section>`;

  const open = S.groceries.filter(g => !g.done).length;
  html += `<section><h2>Boodschappen</h2><div class="group"><button class="row plain" style="width:100%" data-action="tab" data-tab="lijst"><div class="main"><div class="title">${open ? `${open} ${open === 1 ? 'ding' : 'dingen'} op de lijst` : 'Je lijst is leeg'}</div><div class="sub">${open ? esc(S.groceries.filter(g => !g.done).slice(0,4).map(g => g.name).join(', ')) : 'Tik om iets toe te voegen'}</div></div></button></div></section>`;
  return html;
}

/* ---------- personen ---------- */
function ST(){
  if (!S.settings) S.settings = defaultSettings();
  const st = S.settings;
  if (!Array.isArray(st.people) || st.people.length !== 2) st.people = defaultSettings().people;
  if (!Array.isArray(st.aisles) || !st.aisles.length) st.aisles = defaultSettings().aisles;
  if (!st.aisles.some(a => a.id === 'overig')) st.aisles.push({id:'overig', name:'Overig'});
  return st;
}
const people = () => ST().people;
const named = () => people().every(p => (p.name || '').trim());
const person = id => people().find(p => p.id === id);
const other = id => people().find(p => p.id !== id);
function me(){
  const ps = people();
  if (typeof cfg !== 'undefined' && cfg && cfg.mode === 'sync' && sync.email) return ps.find(p => p.email && p.email.toLowerCase() === sync.email.toLowerCase()) || null;
  return ps.find(p => p.id === S.ui.me) || null;
}
function claim(pid){
  if (cfg && cfg.mode === 'sync' && sync.email){
    people().forEach(p => { if (p.email && p.email.toLowerCase() === sync.email.toLowerCase()) p.email = ''; });
    person(pid).email = sync.email; ST().v = Date.now();
  } else S.ui.me = pid;
}
function assignee(t){
  if (t.who === 'rotate') return t.turn || 'p1';
  return t.who === 'p1' || t.who === 'p2' ? t.who : '';
}
function badge(pid){
  const p = person(pid);
  return p && (p.name || '').trim() ? `<span class="who who-${pid}" title="${esc(p.name)}" aria-label="${esc(p.name)}">${esc(p.name.trim()[0].toUpperCase())}</span>` : '';
}
function namesForm(){
  const m = me() || person('p1'), o = other(m.id);
  openForm({title:'Namen', values:{mine:m.name, theirs:o.name},
    fields:[{key:'mine', label:'Jouw naam', type:'text', required:true}, {key:'theirs', label:'Naam van je partner', type:'text', required:true}],
    onSave: v => { m.name = v.mine; o.name = v.theirs; ST().v = Date.now(); claim(m.id); }});
}

/* ---------- taken ---------- */
function taskRow({t, due}){
  const diff = daysBetween(today(), due);
  const cls = diff < 0 ? 'late' : diff === 0 ? 'due' : '';
  return `<div class="row"><button class="check" data-action="done" data-id="${t.id}" aria-label="${esc(t.name)} afvinken"></button>
    <button class="main plain" data-action="editTask" data-id="${t.id}"><div class="title">${esc(t.name)}</div>
    <div class="sub"><span class="${cls}">${relDay(diff, due)}</span>, ${intervalLabel(t).toLowerCase()}${whoText(t)}</div></button>${assignee(t) ? badge(assignee(t)) : ''}</div>`;
}
function whoText(t){
  const a = assignee(t), n = a && person(a) && person(a).name;
  if (t.who === 'rotate') return ', om de beurt' + (n ? ` (nu ${esc(n)})` : '');
  return n ? ', ' + esc(n) : '';
}
function renderTasks(){
  const tasks = S.tasks.map(t => ({t, due: nextDue(t)})).sort((a,b) => a.due - b.due);
  if (!tasks.length) return `<section style="margin-top:12px"><div class="empty"><p>Voeg je terugkerende klussen toe, zoals stofzuigen of het beddengoed verschonen. Vink ze af als ze gedaan zijn; de app plant de volgende keer vanzelf in.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="add" data-what="task">Taak toevoegen</button><button class="btn ghost" data-action="sampleTasks">Voorbeeldtaken gebruiken</button></div></div></section>`;
  const top = peopleCard() || (statsCard() + filterSeg());
  const mine = me();
  const f = S.ui.taskFilter === 'mine' && mine ? 'mine' : 'all';
  const shown = f === 'mine' ? tasks.filter(x => { const a = assignee(x.t); return !a || a === mine.id; }) : tasks;
  const t0 = today(), wk = new Date(t0); wk.setDate(wk.getDate() + 7);
  const groups = [['Nu aan de beurt', x => x.due <= t0], ['Deze week', x => x.due > t0 && x.due < wk], ['Later', x => x.due >= wk]];
  return `<section style="margin-top:12px">${top}</section>` + (shown.length ? '' : '<section><div class="empty"><p>Geen taken voor jou op dit moment.</p></div></section>') + groups.map(([label, g]) => { const list = shown.filter(g); return list.length ? `<section><h2>${label}</h2><div class="group">${list.map(taskRow).join('')}</div></section>` : ''; }).join('')
    + `<section><div class="group"><button class="row addrow" data-action="add" data-what="task">${PLUS}Taak toevoegen</button></div></section>`;
}
function peopleCard(){
  if (!named()) return `<div class="empty"><p>Verdeel de taken: vul jullie namen in, dan kies je bij elke taak wie hem doet, of dat jullie het om de beurt doen.</p><button class="btn" data-action="names">Namen invullen</button></div>`;
  if (!me()) return `<div class="empty"><p>Wie ben jij op deze telefoon?</p><div style="display:flex;gap:8px;flex-wrap:wrap">${people().map(p => `<button class="btn ghost" data-action="claim" data-id="${p.id}">${esc(p.name)}</button>`).join('')}</div></div>`;
  return '';
}
function statsCard(){
  const m = iso(today()).slice(0,7), cnt = {p1:0, p2:0};
  S.tasks.forEach(t => (t.log || []).forEach(l => { if (String(l.d).startsWith(m) && l.by in cnt) cnt[l.by]++; }));
  const max = Math.max(1, cnt.p1, cnt.p2);
  return `<div class="group purse" style="padding:14px 16px"><div class="label">Gedaan in ${monthName(m).split(' ')[0]}</div>${people().map(p => `<div class="statrow">${badge(p.id)}<span class="statname">${esc(p.name)}</span><span class="statbar"><i class="who-${p.id}-bg" style="width:${cnt[p.id] / max * 100}%"></i></span><b class="amt">${cnt[p.id]}</b></div>`).join('')}</div>`;
}
function filterSeg(){
  const f = S.ui.taskFilter === 'mine' ? 'mine' : 'all';
  return `<div class="seg"><button data-action="taskFilter" data-f="all" aria-pressed="${f === 'all'}">Alle taken</button><button data-action="taskFilter" data-f="mine" aria-pressed="${f === 'mine'}">Voor mij</button></div>`;
}
const taskFields = [
  {key:'name', label:'Taak', type:'text', required:true, placeholder:'Bijv. badkamer schoonmaken'},
  {key:'every', label:'Elke', type:'int', def:1, half:true, min:1, max:365},
  {key:'unit', label:'Eenheid', type:'select', def:'w', half:true, options:[['d','dag(en)'],['w','week/weken'],['m','maand(en)']]},
  {key:'next', label:'Volgende keer', type:'date', required:true}
];
function taskForm(t){
  const fields = taskFields.slice();
  if (named()){
    const [a, b] = people();
    fields.push({key:'who', label:'Wie doet het', type:'select', options:[['', 'Samen, wie tijd heeft'], ['p1', a.name], ['p2', b.name], ['rotate', 'Om de beurt']]});
  }
  const vals = t ? {...t, who: ['p1','p2','rotate'].includes(t.who) ? t.who : ''} : {next: iso(today()), who: ''};
  openForm({title: t ? 'Taak' : 'Nieuwe taak', fields, values: vals,
    onSave: v => {
      if (v.who === 'rotate' && !(t && t.who === 'rotate' && t.turn)) v.turn = (me() && me().id) || 'p1';
      t ? Object.assign(t, v) : S.tasks.push({id: uid(), ...v});
    },
    onDelete: t && (() => S.tasks = S.tasks.filter(x => x !== t))});
}
const SAMPLE = [['Stofzuigen',1,'w'],['Badkamer schoonmaken',1,'w'],['Afval buiten zetten',1,'w'],['Beddengoed verschonen',2,'w'],['Planten water geven',4,'d'],['Koelkast schoonmaken',1,'m'],['Ramen lappen',2,'m']];

/* ---------- geld ---------- */
function monthCalc(m){
  const inc = S.income.reduce((a,x) => a + num(x.amount), 0);
  const fix = S.fixed.reduce((a,x) => a + num(x.amount) / (+x.freq || 1), 0);
  const sp = S.spend.filter(x => String(x.date).startsWith(m));
  const spent = sp.reduce((a,x) => a + num(x.amount), 0);
  return {inc, fix, spent, left: inc - fix - spent, sp};
}
function moneyBar(c){
  const total = Math.max(c.inc, c.fix + c.spent) || 1;
  return `<div class="bar" role="img" aria-label="Vaste lasten ${euro(c.fix)}, uitgaven ${euro(c.spent)}, inkomsten ${euro(c.inc)}"><i class="f" style="width:${c.fix/total*100}%"></i><i class="s" style="width:${c.spent/total*100}%"></i></div>
  <dl class="ledger"><dt><span class="sw" style="background:var(--sunk);outline:1px solid var(--line)"></span>Inkomsten</dt><dd>${euro(c.inc)}</dd>
  <dt><span class="sw" style="background:var(--accent)"></span>Vaste lasten per maand</dt><dd>${euro(c.fix)}</dd>
  <dt><span class="sw" style="background:var(--attn-fill)"></span>Uitgaven</dt><dd>${euro(c.spent)}</dd></dl>`;
}
const CATS = ['Boodschappen','Huis','Vervoer','Vrije tijd','Kleding','Gezondheid','Kinderen','Overig'];
const FREQ = {1:'per maand', 3:'per kwartaal', 12:'per jaar'};
function renderMoney(){
  const c = monthCalc(ym);
  let html = `<section style="margin-top:12px"><div class="group purse">
    <div class="monthnav"><button data-action="month" data-d="-1" aria-label="Vorige maand">‹</button><b>${monthName(ym)}</b><button data-action="month" data-d="1" aria-label="Volgende maand">›</button></div>
    <div class="label">Nog te besteden</div><div class="big${c.left < 0 ? ' neg' : ''}">${euro(c.left)}</div>${moneyBar(c)}</div></section>`;

  const sp = c.sp.slice().sort((a,b) => b.date.localeCompare(a.date));
  html += `<section><h2>Uitgaven</h2><div class="group">${sp.map(x => `<div class="row"><button class="main plain" data-action="editSpend" data-id="${x.id}"><div class="title">${esc(x.name)}</div><div class="sub">${fmtDate(parse(x.date))}, ${esc(x.cat)}</div></button><span class="amt">${euro(num(x.amount))}</span></div>`).join('')}
    <button class="row addrow" data-action="add" data-what="spend">${PLUS}Uitgave toevoegen</button></div>`;
  if (sp.length){
    const by = {}; sp.forEach(x => by[x.cat] = (by[x.cat]||0) + num(x.amount));
    html += `<div class="cats">${Object.entries(by).sort((a,b) => b[1]-a[1]).map(([k,v]) => `<span class="cat">${esc(k)} <b>${euro(v)}</b></span>`).join('')}</div>`;
  }
  html += `</section>`;

  const fx = S.fixed.slice().sort((a,b) => (+a.day||99) - (+b.day||99));
  html += `<section><h2>Vaste lasten</h2><div class="group">${fx.map(x => `<div class="row"><button class="main plain" data-action="editFixed" data-id="${x.id}"><div class="title">${esc(x.name)}</div><div class="sub">${FREQ[x.freq] || 'per maand'}${x.day ? `, rond de ${x.day}e` : ''}${+x.freq > 1 ? `, ${euro(num(x.amount)/x.freq)} per maand` : ''}</div></button><span class="amt">${euro(num(x.amount))}</span></div>`).join('')}
    <button class="row addrow" data-action="add" data-what="fixed">${PLUS}Vaste last toevoegen</button></div></section>`;

  html += `<section><h2>Inkomsten per maand</h2><div class="group">${S.income.map(x => `<div class="row"><button class="main plain" data-action="editIncome" data-id="${x.id}"><div class="title">${esc(x.name)}</div></button><span class="amt">${euro(num(x.amount))}</span></div>`).join('')}
    <button class="row addrow" data-action="add" data-what="income">${PLUS}Inkomen toevoegen</button></div></section>`;
  return html;
}

function fixedForm(x){
  openForm({title: x ? 'Vaste last' : 'Nieuwe vaste last', values: x || {freq: 1},

let KWLIST = null;
const norm = s => ' ' + String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim() + ' ';
function classify(name){
  if (!KWLIST){ KWLIST = []; for (const [id, list] of Object.entries(KW)) list.split(',').forEach(k => { k = norm(k).trim(); if (k) KWLIST.push([k, id]); }); }
  const n = norm(name); let best = null;
  for (const [k, id] of KWLIST) if (n.includes(' ' + k) && (!best || k.length > best[0].length)) best = [k, id];
  return best ? best[1] : 'overig';
}
function parseItem(raw){
  const s = String(raw).trim().replace(/\s+/g, ' ');
  let m = s.match(/^(\d{1,3})\s*[x×]?\s+(.+)$/i);
  if (m && !/^(kg|kilo|g|gr|gram|ons|l|liter|ml|cl|dl)\b/i.test(m[2])) return {qty: Math.max(1, +m[1]), name: m[2]};
  m = s.match(/^(.+?)\s*[x×]\s*(\d{1,3})$/i) || s.match(/^(.+?)\s+(\d{1,3})\s*[x×]$/i);
  if (m) return {qty: Math.max(1, +m[2]), name: m[1]};
  return {qty: 1, name: s};
}
function aisleOf(g){
  const ids = new Set(ST().aisles.map(a => a.id));
  if (ids.has(g.aisle)) return g.aisle;
  const h = S.history[g.name.toLowerCase()];
  if (h && ids.has(h.aisle)) return h.aisle;
  const c = classify(g.name);
  return ids.has(c) ? c : 'overig';
}

function addGrocery(raw){
  const {qty, name} = parseItem(raw); if (!name) return;
  const key = name.toLowerCase(), h = S.history[key];

  const cur = S.groceries.find(g => !g.done && g.name.toLowerCase() === key);

  const hh = h || {name, count:0}; hh.count++; hh.name = name; hh.aisle = aisle; S.history[key] = hh;

function renderAgenda(){
  const t = iso(today());
  const sorted = S.events.slice().sort((a,b) => (a.date + (a.time||'')).localeCompare(b.date + (b.time||'')));
  const late = sorted.filter(e => e.kind === 'deadline' && !e.done && e.date < t);
  const up = sorted.filter(e => !e.done && e.date >= t);
  const past = sorted.filter(e => (e.done || e.date < t) && !late.includes(e)).reverse();
  if (!S.events.length) return `<section style="margin-top:12px"><div class="empty"><p>Zet hier afspraken en deadlines neer, zoals de tandarts, de belastingaangifte of het opzeggen van een abonnement. Deadlines kun je afvinken als ze geregeld zijn.</p><button class="btn" data-action="add" data-what="event">Afspraak toevoegen</button></div></section>`;

    + `<section${late.length ? '' : ' style="margin-top:12px"'}><h2>Komend</h2><div class="group">${up.map(eventRow).join('')}<button class="row addrow" data-action="add" data-what="event">${PLUS}Afspraak of deadline toevoegen</button></div></section>`

function openForm({title, fields, values = {}, onSave, onDelete}){
  const dlg = $('#sheet');
  const inputs = fields.map(fl => {
    let v = values[fl.key] ?? fl.def ?? ''; const id = 'f_' + fl.key; let input;
    if (fl.type === 'select') input = `<select id="${id}" name="${fl.key}">${fl.options.map(([val,lab]) => `<option value="${esc(val)}"${String(val) === String(v) ? ' selected' : ''}>${esc(lab)}</option>`).join('')}</select>`;
    else if (fl.type === 'textarea') input = `<textarea id="${id}" name="${fl.key}" rows="3">${esc(v)}</textarea>`;
    else { if (fl.type === 'money' && v !== '') v = num(v).toFixed(2).replace('.', ',');
      const type = fl.type === 'money' || fl.type === 'int' ? 'text' : fl.type;
      const mode = fl.type === 'money' ? ' inputmode="decimal"' : fl.type === 'int' ? ' inputmode="numeric"' : '';
      input = `<input id="${id}" name="${fl.key}" type="${type}"${mode} value="${esc(v)}"${fl.placeholder ? ` placeholder="${esc(fl.placeholder)}"` : ''} autocomplete="off">`; }
    return `<div class="field${fl.half ? ' half' : ''}"><label for="${id}">${esc(fl.label)}</label>${input}</div>`;
  }).join('');
  dlg.onclick = null; dlg.oninput = null;
  dlg.innerHTML = `<form class="sheet" novalidate><div class="sheet-head"><button type="button" class="link" data-close>Annuleren</button><h3>${esc(title)}</h3><button type="submit" class="link strong">Bewaren</button></div>
    <div class="fields">${inputs}</div><p class="err" hidden></p>${onDelete ? '<button type="button" class="btn danger wide" data-del>Verwijderen</button>' : ''}</form>`;
  const form = dlg.querySelector('form'), err = form.querySelector('.err');
  form.onsubmit = ev => {
    ev.preventDefault(); const out = {};
    for (const fl of fields){
      let v = form.elements[fl.key].value.trim();
      if (fl.required && !v){ err.textContent = `Vul ${fl.label.toLowerCase()} in.`; err.hidden = false; form.elements[fl.key].focus(); return; }
      if (fl.type === 'money') v = v === '' ? 0 : num(v);
      if (fl.type === 'int') v = v === '' ? '' : Math.min(fl.max ?? 9999, Math.max(fl.min ?? 1, parseInt(v) || 1));
      out[fl.key] = v;
    }
    onSave(out); dlg.close(); save(); render(); toast('Bewaard');
  };
  form.querySelector('[data-close]').onclick = () => dlg.close();
  const del = form.querySelector('[data-del]');
  if (del) del.onclick = () => { const undo = snapshot(); onDelete(); dlg.close(); save(); render(); toast('Verwijderd', undo); };
  if (!dlg.open) dlg.showModal();
}

async function exportData(){
  const name = `huishouden-backup-${iso(today())}.json`;
  const blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'});
  try { const file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Back-up huishouden'}); return; }
  } catch(e){ if (e.name === 'AbortError') return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}
function importData(file){
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    let data; try { data = JSON.parse(r.result); } catch(e){ toast('Dit bestand kan niet gelezen worden. Kies een back-up die met deze app is gemaakt.'); return; }
    const keys = ['tasks','income','fixed','spend','groceries','events'];
    if (!data || typeof data !== 'object' || !keys.some(k => Array.isArray(data[k]))){ toast('Dit bestand is geen back-up van deze app.'); return; }
    if (!confirm(cfg && cfg.mode === 'sync' ? 'Dit vervangt de gedeelde gegevens, voor jullie allebei, door de back-up. Doorgaan?' : 'Dit vervangt alle gegevens op deze telefoon door de back-up. Doorgaan?')) return;
    const undo = snapshot(); S = Object.assign(empty(), data); save(); $('#sheet').close(); render(); toast('Back-up teruggezet', undo);
  };
  r.readAsText(file);
}

/* ---------- interactie ---------- */
const find = (list, id) => S[list].find(x => x.id === id);
document.addEventListener('click', e => {
  const b = e.target.closest('[data-action]'); if (!b) return;
  const {action, id} = b.dataset;
  switch (action){
    case 'tab': tab = b.dataset.tab; S.ui.tab = tab; save(); render(); scrollTo(0,0); break;
    case 'headerAdd': ({taken:() => taskForm(), geld:() => spendForm(), agenda:() => eventForm()})[tab]?.(); break;
    case 'add': ({task:() => taskForm(), spend:() => spendForm(), fixed:() => fixedForm(), income:() => incomeForm(), event:() => eventForm()})[b.dataset.what](); break;
    case 'done': { const t = find('tasks', id), prev = JSON.stringify(t);
      const by = (me() && me().id) || assignee(t) || null;
      t.last = iso(today()); t.next = iso(addInterval(today(), t.every, t.unit));
      t.log = (t.log || []).concat({d: t.last, by}).slice(-60);
      if (t.who === 'rotate'){ const cur = by || assignee(t); t.turn = other(cur).id; }
      save(); render();
      const nxt = t.who === 'rotate' && person(t.turn).name ? `, ${person(t.turn).name} is aan de beurt` : '';
      toast(`${t.name} gedaan. Volgende keer: ${fmtDate(parse(t.next))}${nxt}`, () => { const old = JSON.parse(prev); for (const k of Object.keys(t)) delete t[k]; Object.assign(t, old); save(); render(); }); break; }
    case 'names': namesForm(); break;
    case 'claim': claim(id); save(); render(); break;
    case 'taskFilter': S.ui.taskFilter = b.dataset.f; save(); render(); break;
    case 'editG': groceryForm(find('groceries', id)); break;
    case 'aisles': aisleSheet(); break;
    case 'editTask': taskForm(find('tasks', id)); break;
    case 'sampleTasks': { const d = iso(today()); SAMPLE.forEach(([name, every, unit]) => S.tasks.push({id: uid(), name, every, unit, next: d, who:''})); save(); render(); toast('Voorbeeldtaken toegevoegd. Pas ze aan door erop te tikken.'); break; }
    case 'editSpend': spendForm(find('spend', id)); break;
    case 'editFixed': fixedForm(find('fixed', id)); break;
    case 'editIncome': incomeForm(find('income', id)); break;
    case 'month': { const d = parse(ym + '-01'); d.setMonth(d.getMonth() + (+b.dataset.d)); ym = iso(d).slice(0,7); render(); break; }
    case 'toggleG': { const g = find('groceries', id); g.done = !g.done; save(); render(); break; }
    case 'delG': S.groceries = S.groceries.filter(g => g.id !== id); save(); render(); break;
    case 'clearG': { const undo = snapshot(); S.groceries = S.groceries.filter(g => !g.done); save(); render(); toast('Afgevinkte weggehaald', undo); break; }
    case 'sugg': addGrocery(b.dataset.name); save(); render(); break;
    case 'editEvent': eventForm(find('events', id)); break;
    case 'toggleEv': { const ev = find('events', id); ev.done = !ev.done; save(); render(); break; }
    case 'hideInstall': S.ui.hideInstall = true; save(); render(); break;
    case 'settings': openSettings(); break;
    case 'gateLocal': case 'gateCopySql': case 'gateSaveCfg': case 'login': case 'signup': gateAction(action); break;
    case 'reconfig': $('#sheet').open && $('#sheet').close(); gateAction('reconfig'); break;
    case 'syncNow': refresh().then(() => { $('#sheet').close(); toast(syncStatus === 'ok' ? 'Alles is gesynchroniseerd' : 'Synchroniseren lukt nu niet'); }); break;
    case 'logout': logout(); break;
    case 'export': exportData(); break;
    case 'wipe': if (confirm('Weet je zeker dat je alle gegevens op deze telefoon wilt wissen?')){ const undo = snapshot(); const ui = S.ui; S = empty(); S.ui = ui; save(); $('#sheet').close(); render(); toast('Alles gewist', undo); } break;
  }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.form !== 'grocery') return;
  e.preventDefault();
  const input = e.target.querySelector('input[name=item]');
  input.value.split(',').forEach(addGrocery); save(); render();
  $('#view input[name=item]').focus();
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('#sheet').open && !gate) render(); });

/* ---------- synchronisatie (Supabase) ---------- */
const CFG_KEY = 'huishouden.cfg', SYNC_KEY = 'huishouden.sync';
const COLL = ['tasks','income','fixed','spend','groceries','events'];
const readJSON = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch(e){ return d; } };
const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} };
let cfg = readJSON(CFG_KEY, null);            // {mode:'local'} of {mode:'sync', url, key}
let sync = readJSON(SYNC_KEY, {known:null, pending:{}, member:false, email:''});
let sb = null, session = null, channel = null, gate = null, gateMsg = '', gateMsgBad = false;
let syncStatus = 'ok', syncError = '', flushTimer, flushing = false, deferredRender = false;
const syncing = () => !!(cfg && cfg.mode === 'sync' && sb && session && sync.member);
const persistSync = () => writeJSON(SYNC_KEY, sync);

function setStatus(s, err=''){
  syncStatus = s; syncError = err;
  const dot = $('#syncDot'); if (dot) dot.className = 'syncdot ' + (syncing() ? s : '');
}
function itemsOf(state){
  const m = {};
  for (const k of COLL) for (const x of state[k] || []) m[x.id] = {kind:k, data:x};
  for (const [key,h] of Object.entries(state.history || {})) m['h:' + key] = {kind:'history', data:h};
  if (state.settings) m.settings = {kind:'settings', data:state.settings};
  return m;
}
function diffToPending(){
  if (!syncing()) return;
  const now = itemsOf(S), known = sync.known || {};
  for (const [id, {kind, data}] of Object.entries(now)){
    if (id === 'settings' && !known[id] && !(data.v > 0)) continue;   // standaardinstellingen nooit over die van de ander heen zetten
    const j = JSON.stringify(data);
    if (!known[id] || known[id].j !== j){ sync.pending[id] = {id, kind, data, deleted:false}; known[id] = {k:kind, j}; }
  }
  for (const id of Object.keys(known)) if (!now[id]){ sync.pending[id] = {id, kind: known[id].k, data:{}, deleted:true}; delete known[id]; }
  sync.known = known; persistSync(); scheduleFlush();
}
function scheduleFlush(ms = 400){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
async function flush(){
  if (!syncing() || flushing) return;
  const items = Object.values(sync.pending);
  if (!items.length){ setStatus('ok'); return; }
  flushing = true; setStatus('busy');
  const batch = items.slice(0, 500);
  let error;
  try { ({error} = await sb.from('items').upsert(batch.map(p => ({id:p.id, kind:p.kind, data:p.data, deleted:p.deleted, updated_at:new Date().toISOString()})))); }
  catch(e){ error = e; }
  flushing = false;
  if (error){ setStatus(navigator.onLine ? 'error' : 'offline', error.message || String(error)); scheduleFlush(20000); return; }
  for (const p of batch) if (sync.pending[p.id] === p) delete sync.pending[p.id];
  persistSync();
  if (Object.keys(sync.pending).length) flush(); else setStatus('ok');
}
function upsertLocal(kind, data, id){
  if (kind === 'settings'){ const cur = ST(); for (const k of Object.keys(cur)) if (!(k in data)) delete cur[k]; Object.assign(cur, data); ST(); return; }
  if (kind === 'history'){ const k = id.slice(2); if (S.history[k]) Object.assign(S.history[k], data); else S.history[k] = data; return; }
  if (!COLL.includes(kind)) return;
  const cur = S[kind].find(x => x.id === id);
  if (cur){ for (const key of Object.keys(cur)) if (!(key in data)) delete cur[key]; Object.assign(cur, data); }
  else S[kind].push(data);
}
function removeLocal(id, kind){
  if (kind === 'history') delete S.history[id.slice(2)];
  else if (COLL.includes(kind)) S[kind] = S[kind].filter(x => x.id !== id);
}
function applyRows(rows, full){
  const known = sync.known || {};
  let changed = false;
  if (full){
    const ids = new Set(rows.map(r => r.id));
    for (const id of Object.keys(known)) if (!ids.has(id) && !sync.pending[id]){ removeLocal(id, known[id].k); delete known[id]; changed = true; }
  }
  for (const r of rows){
    if (sync.pending[r.id]) continue;
    if (r.deleted){ if (known[r.id]){ removeLocal(r.id, r.kind); delete known[r.id]; changed = true; } continue; }
    const j = JSON.stringify(r.data);
    if (known[r.id] && known[r.id].j === j) continue;
    upsertLocal(r.kind, r.data, r.id); known[r.id] = {k:r.kind, j: JSON.stringify(r.data)}; changed = true;
  }
  sync.known = known; persistSync();
  if (changed){ saveLocal(); softRender(); }
}
function softRender(){
  const a = document.activeElement;
  if ($('#sheet').open || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) deferredRender = true; else render();
}
document.addEventListener('focusout', () => setTimeout(() => { if (deferredRender && !$('#sheet').open){ deferredRender = false; render(); } }, 50));
$('#sheet').addEventListener('close', () => { if (deferredRender){ deferredRender = false; render(); } });

async function pull(){
  if (!syncing()) return;
  let rows = [], from = 0;
  try {
    for (;;){
      const {data, error} = await sb.from('items').select('id,kind,data,deleted').range(from, from + 999);
      if (error) throw error;
      rows = rows.concat(data); if (data.length < 1000) break; from += 1000;
    }
  } catch(e){ setStatus(navigator.onLine ? 'error' : 'offline', e.message || String(e)); return; }
  applyRows(rows, true);
  if (!Object.keys(sync.pending).length) setStatus('ok');
}
function subscribe(){
  if (channel) sb.removeChannel(channel);
  channel = sb.channel('items-live')
    .on('postgres_changes', {event:'*', schema:'public', table:'items'}, p => { if (p.new && p.new.id) applyRows([p.new], false); })
    .subscribe();
}
async function refresh(){ if (!syncing()) return; await flush(); await pull(); }
window.addEventListener('online', refresh);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

async function startSync(){
  if (!cfg){ gate = 'setup'; render(); return; }
  if (cfg.mode !== 'sync'){ gate = null; render(); return; }
  if (!window.supabase){
    if (sync.member){ gate = null; render(); setStatus('offline', 'Geen verbinding met de database.'); }
    else { gate = 'login'; gateMsg = 'Geen verbinding. Controleer je internet en open de app opnieuw.'; gateMsgBad = true; render(); }
    return;
  }
  sb = window.supabase.createClient(cfg.url, cfg.key, {auth:{persistSession:true, autoRefreshToken:true, storageKey:'huishouden.auth'}});
  try { session = (await sb.auth.getSession()).data.session; } catch(e){ session = null; }
  if (session) await afterLogin(); else { gate = 'login'; render(); }
}
async function afterLogin(){
  let ok = sync.member && sync.email === session.user.email;
  try { const {data, error} = await sb.rpc('is_member'); if (!error) ok = data === true; } catch(e){}
  if (!ok){
    await sb.auth.signOut().catch(() => {}); session = null;
    gate = 'login'; gateMsg = 'Dit account heeft geen toegang. Staat dit e-mailadres in het installatiescript dat je in Supabase hebt uitgevoerd?'; gateMsgBad = true; render(); return;
  }
  if (sync.email !== session.user.email){ sync.known = null; sync.pending = {}; }
  sync.member = true; sync.email = session.user.email; persistSync();
  gate = null; render();
  diffToPending();       // eerste keer: lokale gegevens gaan mee naar de database
  await flush(); await pull(); subscribe();
}
function sqlScript(emails){
  const list = emails.map(e => `  ('${e.trim().toLowerCase().replace(/'/g, "''")}')`).join(',\n');
  return `-- Huishouden: tabel, toegang en beveiliging
create table if not exists public.items (
  id text primary key,
  kind text not null,
  data jsonb not null default '{}'::jsonb,
  deleted boolean not null default false,
  updated_at timestamptz not null default now()
);
create table if not exists public.leden (email text primary key);
insert into public.leden (email) values
${list}
on conflict do nothing;

alter table public.items enable row level security;
alter table public.leden enable row level security;
grant select, insert, update, delete on public.items to authenticated;

create or replace function public.is_member() returns boolean
language sql stable security definer set search_path = public as $$
  select exists (select 1 from public.leden where email = lower(auth.jwt() ->> 'email'));
$$;
revoke execute on function public.is_member() from public, anon;
grant execute on function public.is_member() to authenticated;

drop policy if exists "alleen leden" on public.items;
create policy "alleen leden" on public.items for all to authenticated
  using (public.is_member()) with check (public.is_member());

do $$ begin
  alter publication supabase_realtime add table public.items;
exception when duplicate_object then null;
end $$;`;
}
function renderGate(){
  if (gate === 'setup') return `<div class="gate">
    <section style="margin-top:12px"><div class="group"><p>Koppel de app aan jullie eigen Supabase-database, dan zien jullie allebei dezelfde taken, boodschappen, agenda en financiën. Dit doe je één keer per telefoon.</p>
      <button class="linkbtn" data-action="gateLocal">Liever zonder synchronisatie, alleen op deze telefoon</button></div></section>
    <section><h2>Installatiescript</h2><div class="group"><p class="sub">Alleen nodig voor wie de database aanmaakt. Vul jullie twee e-mailadressen in en plak het script in de SQL Editor van Supabase.</p>
      <div class="fields"><div class="field"><label for="g_e1">Jouw e-mailadres</label><input id="g_e1" type="email" autocomplete="email"></div>
      <div class="field"><label for="g_e2">E-mailadres van je partner</label><input id="g_e2" type="email" autocomplete="off"></div></div>
      <button class="btn ghost wide" data-action="gateCopySql">Script kopiëren</button><textarea id="g_sql" rows="6" hidden readonly style="margin-top:10px"></textarea></div></section>
    <section><h2>Gegevens van je project</h2><div class="group">
      <div class="fields"><div class="field"><label for="g_url">Project URL</label><input id="g_url" type="url" placeholder="https://xxxx.supabase.co" autocapitalize="off" autocomplete="off" value="${esc(cfg && cfg.url || '')}"></div>
      <div class="field"><label for="g_key">Publishable key</label><input id="g_key" type="text" placeholder="sb_publishable_…" autocapitalize="off" autocomplete="off" spellcheck="false" value="${esc(cfg && cfg.key || '')}"></div></div>
      <button class="btn wide" data-action="gateSaveCfg">Koppelen</button><p class="msg${gateMsgBad ? ' bad' : ' good'}" ${gateMsg ? '' : 'hidden'}>${esc(gateMsg)}</p></div></section></div>`;
  return `<div class="gate"><section style="margin-top:12px"><div class="group">
    <p>Log in met het e-mailadres dat in het installatiescript staat. Heb je nog geen account, maak er dan een aan.</p>
    <div class="fields"><div class="field"><label for="l_email">E-mailadres</label><input id="l_email" type="email" autocomplete="username" value="${esc(sync.email || '')}"></div>
    <div class="field"><label for="l_pw">Wachtwoord</label><input id="l_pw" type="password" autocomplete="current-password"></div></div>
    <div class="stack" style="display:grid;gap:10px"><button class="btn wide" data-action="login">Inloggen</button><button class="btn ghost wide" data-action="signup">Account aanmaken</button></div>
    <p class="msg${gateMsgBad ? ' bad' : ' good'}" ${gateMsg ? '' : 'hidden'}>${esc(gateMsg)}</p></div></section>
    <button class="linkbtn" data-action="reconfig" style="margin-left:4px">Koppeling wijzigen</button></div>`;
}
function authMessage(err){
  const m = (err && err.message || '').toLowerCase();
  if (m.includes('invalid login')) return 'E-mailadres of wachtwoord klopt niet.';
  if (m.includes('not confirmed')) return 'Bevestig eerst je e-mailadres via de link in je mail en log daarna hier in.';
  if (m.includes('signups not allowed') || m.includes('signup is disabled')) return 'Nieuwe accounts zijn uitgeschakeld in Supabase.';
  if (m.includes('already registered')) return 'Er bestaat al een account met dit e-mailadres. Log in.';
  if (m.includes('password')) return 'Kies een wachtwoord van minimaal 6 tekens.';
  if (m.includes('fetch') || m.includes('network')) return 'Geen verbinding met de database. Controleer je internet en de Project URL.';
  return 'Dat lukte niet: ' + (err && err.message || 'onbekende fout');
}
async function gateAction(action){
  const show = (msg, bad) => { gateMsg = msg; gateMsgBad = bad; const el = $('#view .msg'); if (el){ el.textContent = msg; el.className = 'msg ' + (bad ? 'bad' : 'good'); el.hidden = false; } else render(); };
  if (action === 'gateLocal'){ cfg = {mode:'local'}; writeJSON(CFG_KEY, cfg); gate = null; gateMsg = ''; render(); return; }
  if (action === 'reconfig'){ if (sb) await sb.auth.signOut().catch(() => {}); session = null; gate = 'setup'; gateMsg = ''; render(); return; }
  if (action === 'gateCopySql'){
    const e1 = $('#g_e1').value.trim(), e2 = $('#g_e2').value.trim();
    if (!/@/.test(e1)){ $('#g_e1').focus(); toast('Vul eerst je e-mailadres in.'); return; }
    const sql = sqlScript([e1, e2].filter(e => /@/.test(e)));
    const ta = $('#g_sql'); ta.value = sql; ta.hidden = false;
    try { await navigator.clipboard.writeText(sql); toast('Script gekopieerd. Plak het in de SQL Editor van Supabase.'); }
    catch(e){ ta.focus(); ta.select(); toast('Kopiëren lukte niet automatisch. Selecteer de tekst en kopieer hem zelf.'); }
    return;
  }
  if (action === 'gateSaveCfg'){
    const url = $('#g_url').value.trim().replace(/\/+$/, ''), key = $('#g_key').value.trim();
    if (!/^https:\/\/[^\s]+$/.test(url)) return show('Vul de Project URL in, die begint met https://', true);
    if (key.length < 20) return show('Vul de publishable key in. Die vind je in Supabase bij Project Settings → API Keys.', true);
    if (/secret|service_role/i.test(key)) return show('Dit lijkt een geheime sleutel. Gebruik de publishable key; de geheime sleutel hoort niet in de app.', true);
    cfg = {mode:'sync', url, key}; writeJSON(CFG_KEY, cfg); gateMsg = ''; sb = null; startSync(); return;
  }
  const email = $('#l_email').value.trim(), password = $('#l_pw').value;
  if (!email || !password) return show('Vul je e-mailadres en wachtwoord in.', true);
  if (!sb) return show('Geen verbinding met de database. Controleer je internet en open de app opnieuw.', true);
  if (action === 'login'){
    const {data, error} = await sb.auth.signInWithPassword({email, password});
    if (error) return show(authMessage(error), true);
    session = data.session; gateMsg = ''; afterLogin();
  }
  if (action === 'signup'){
    const {data, error} = await sb.auth.signUp({email, password, options:{emailRedirectTo: location.origin + location.pathname}});
    if (error) return show(authMessage(error), true);
    if (data.session){ session = data.session; gateMsg = ''; afterLogin(); }
    else show('Account aangemaakt. Open de bevestigingsmail, tik op de link en log daarna hier in.', false);
  }
}
async function logout(){
  if (!confirm('Uitloggen? De gegevens blijven bewaard in de database, maar worden van deze telefoon verwijderd.')) return;
  await flush();
  if (Object.keys(sync.pending).length && !confirm('Niet alle wijzigingen zijn al opgeslagen in de database. Toch uitloggen?')) return;
  if (channel) sb.removeChannel(channel);
  await sb.auth.signOut().catch(() => {}); session = null;
  const ui = S.ui; S = empty(); S.ui = ui; saveLocal();
  sync = {known:null, pending:{}, member:false, email:sync.email}; persistSync();
  $('#sheet').close(); gate = 'login'; gateMsg = ''; render();
}

startSync();
</script>
